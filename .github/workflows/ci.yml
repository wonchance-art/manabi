name: CI

# 이 리포의 검증은 그동안 전부 로컬 실행에만 의존했다. 그래서 `npm run e2e`가 오래 red인 채로
# 아무에게도 안 걸렸다(#872~#874에서 발견). 게이트를 여기로 옮겨 사람 없이도 red가 드러나게 한다.

on:
  pull_request:
  push:
    branches: [main]
  # 수동 재실행 — 러너 플레이크로 main이 red일 때 커밋 없이 다시 돌린다
  # (2026-08-19 learning-flow 드래그 타임아웃: 로컬 9/9 재현 불가 → 플레이크 판정 선례).
  workflow_dispatch:

# 같은 브랜치에 새 푸시가 오면 진행 중인 실행은 취소한다(러너 시간 절약).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint · 콘텐츠 게이트 · vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run lint

      # 콘텐츠 방어선 — 드릴 비중복(4트랙)·병음 정합·글자 커버 등.
      # next build의 prebuild와 동일한 체인이라 여기서 먼저 깨뜨려 빌드 시간을 아낀다.
      - name: 콘텐츠 게이트 (prebuild)
        run: npm run prebuild

      # 일상 게이트 — world 제외(실측 408s → 약 145s). world는 아래 전용 job이 책임진다.
      - run: npm test

      # 실제 PostgreSQL에서 과 번호 충돌·재전송·늦은 분석 덮어쓰기를 검사한다.
      - run: node scripts/verification/library-book-chapters.mjs
      - run: node supabase/tests/vocabulary-exclusion.mjs
      - run: node supabase/tests/known-word-controls.mjs
      - run: node supabase/tests/explicit-data-api-grants.mjs
      - run: node supabase/tests/user-word-facets.mjs
      - run: node supabase/tests/user-level-rounds.mjs
      - run: node supabase/tests/korean-learning-support.mjs
      - run: node supabase/tests/korean-source-passage.mjs
      - run: node supabase/tests/learning-contract-catalog.mjs
      - run: node supabase/tests/fsrs-anki-v2-policy.mjs
      - run: node supabase/tests/conversation-lobby.mjs
      - run: node supabase/tests/fsrs-day-boundary-due.mjs
      - run: node supabase/tests/anon-book-catalog.mjs
      - run: node supabase/tests/canonical-book-releases.mjs
      - run: node supabase/tests/canonical-art-shelf.mjs
      - run: node supabase/tests/canonical-analysis-jobs.mjs
      - run: node scripts/verification/n4-book-support.mjs
      - run: node scripts/verification/n3-book-support.mjs
      - run: node supabase/tests/korean-capability-repin.mjs
      - run: node supabase/tests/vocabulary-snapshot-set-flags.mjs
      - run: node supabase/tests/contract-hash-cache.mjs
      - run: node supabase/tests/vocabulary-snapshot-light.mjs
      - run: node supabase/tests/vocab-due-day-boundary-realign.mjs
      - run: node supabase/tests/cohort-rpc-revoke.mjs
      - run: node supabase/tests/profiles-privacy.mjs
      - run: node supabase/tests/vocabulary-snapshot-cards.mjs
      # 관측 fixture 위에 관측일 뒤 마이그레이션을 차례로 적용해 FSRS 핀 넷 · 모든 언어 ready를 실제 지문으로 확인한다
      # (FINGERPRINT-REPIN-002). 이미 나간 위반은 스크립트의 EXPECTED_BREAKS(정확한 상태)로만 통과한다.
      - run: node supabase/tests/post-observation-migrations.mjs

  e2e:
    name: e2e (smoke · learning-flow)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # NEXT_PUBLIC_* 는 빌드 시점에 번들로 인라인된다. 런타임에만 주면 클라이언트 인증이
      # 에러 없이 조용히 죽으므로(#869 오판 선례), 빌드와 실행이 반드시 같은 값을 써야 한다.
      # e2e:build 스크립트가 그 값을 고정해 들고 있다.
      - name: 테스트 env로 빌드
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://e2e.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
          E2E_PUBLISHED_EDITION: 8a8c1c1fd452773810abaf8c
          NODE_OPTIONS: --import=./e2e/server-fetch-mock.mjs
        run: npm run e2e:build

      # 글꼴 힌트 산출 대조(FONT-HINT-001) — 빌드와 같은 글꼴 입력(대역)으로 힌트 주소가 산출 파일 ·
      # @font-face · 서버 번들과 맞는지 본다. next 업그레이드로 파일 이름 규칙이 바뀌면 여기서 깨진다. 빌드 추가 없음.
      - name: 글꼴 힌트 산출 대조
        run: NEXT_FONT_GOOGLE_MOCKED_RESPONSES="$PWD/e2e/fixtures/google-fonts-mock.cjs" node scripts/fonts/check-font-hints.mjs
      # 간체 중국어 독립 스타일시트 산출 대조(SC-LINK-001) — public CSS · 글꼴 · next/font 'Noto Sans SC'와 같은 덮는 범위. 빌드 추가 없음.
      - name: 간체 독립 스타일시트 산출 대조
        run: NEXT_FONT_GOOGLE_MOCKED_RESPONSES="$PWD/e2e/fixtures/google-fonts-mock.cjs" node scripts/fonts/check-sc-stylesheet.mjs
      # 정적 · ISR 경로 산출 대조(GUEST-STATIC-001) — 공유 캐시에 맡기는 화면이 실제로 정적(○ · ●)으로 구워졌고 ISR 주기가 표와 같다.
      # 쿠키 · 헤더 · searchParams가 끼어 동적(ƒ)으로 바뀌면 여기서 깨진다(src/lib/staticRoutes.js). 빌드 추가 없음.
      - name: 정적 경로 산출 대조
        run: node scripts/check-static-routes.mjs

      # 브라우저는 러너에 미리 깔린 Google Chrome을 쓴다(playwright.config.mjs 기본 channel).
      - name: Chrome 확인
        run: google-chrome --version

      # 조판 기하 계약 — 빌드가 필요 없어(index.css 실물 + 정적 마크업) 제일 싸므로 먼저.
      # 병음·요미가나의 실렌더 좌표(토글 시프트 0·그리드 단일값·겹침 0)를 지킨다 —
      # 소스 계약만으로는 못 잡는 상호작용 회귀가 하루 5PR 왕복의 원인이었다(2026-08-19).
      - run: npm run e2e:typography

      # 뷰어 크롬 기하 계약(뷰어 정돈 A안) — 첫 글자가 나오기까지의 높이를 브라우저 좌표로 지킨다.
      # 조판 e2e와 같은 방식(index.css 실물 + 정적 마크업)이라 빌드가 필요 없다.
      - run: npm run e2e:chrome

      - run: npm run e2e

      - run: npm run e2e:learning

      - name: 서재 과 추가·관리 (프로덕션 앱 + 격리 PostgreSQL)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://e2e.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
          COMPOSER_BASE_URL: http://127.0.0.1:8878
        run: |
          export NODE_OPTIONS="--import=$PWD/e2e/server-fetch-mock.mjs"
          export COMPOSER_TEST_MODULES="$PWD/node_modules"
          E2E_PUBLISHED_EDITION=8a8c1c1fd452773810abaf8c node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 8878 > /tmp/library-chapter-server.log 2>&1 &
          chapter_server_pid=$!
          trap 'kill "$chapter_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8878/manifest.webmanifest > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8878/manifest.webmanifest > /dev/null
          QA_BASE=http://127.0.0.1:8878 node --test --test-concurrency=1 e2e/library-book-chapters.e2e.mjs e2e/library-management.e2e.mjs e2e/learning-flow-clarity.e2e.mjs e2e/textbook-reading-clarity.e2e.mjs e2e/book-reading-reload.e2e.mjs e2e/viewer-response.e2e.mjs e2e/viewer-hun-layout.e2e.mjs e2e/viewer-exclusion.e2e.mjs e2e/viewer-language-settings.e2e.mjs e2e/viewer-focus-move.e2e.mjs e2e/viewer-r0-display.e2e.mjs e2e/viewer-zh-grid.e2e.mjs e2e/viewer-ja-kinsoku.e2e.mjs e2e/korean-learning.e2e.mjs e2e/learner-archive-links.e2e.mjs e2e/viewer-word-card.e2e.mjs e2e/viewer-en-card.e2e.mjs e2e/viewer-boundary-edit.e2e.mjs e2e/viewer-paged-reader.e2e.mjs e2e/auth-account-guidance.e2e.mjs e2e/viewer-dialog-guards.e2e.mjs e2e/account-boundary.e2e.mjs e2e/viewer-select-paint.e2e.mjs
          # N4 표지(BOOK-HOME-RESTORE-001)는 N4를 발행한 서버에서만 돈다. 발행 여부는 서버 프로세스의 server-fetch-mock이 읽는 값이라
          # 같은 빌드로 서버를 하나 더 띄워 이 파일만 다시 돌린다 — 위 서버의 다른 e2e는 N5만 발행된 그대로(기본 실행의 N4는 건너뜀).
          E2E_PUBLISHED_BOOKS=japanese-n4 E2E_PUBLISHED_EDITION=8a8c1c1fd452773810abaf8c node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 8879 > /tmp/book-n4-server.log 2>&1 &
          n4_server_pid=$!
          trap 'kill "$chapter_server_pid" "$n4_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do if curl -fsS http://127.0.0.1:8879/manifest.webmanifest > /dev/null; then break; fi; sleep 1; done
          # 책장 · 교재 첫 화면은 ISR(빌드 때 N5만 발행된 판) — 이 서버의 발행 상태(N4)로 판을 새로 만든다(운영의 발행 즉시 무효화와 같은 일, GUEST-STATIC-001).
          node scripts/e2e-refresh-isr.mjs http://127.0.0.1:8879 /lessons /books
          E2E_PUBLISHED_BOOKS=japanese-n4 COMPOSER_BASE_URL=http://127.0.0.1:8879 node --test --test-concurrency=1 e2e/book-reading-reload.e2e.mjs

      # 같은 프로덕션 빌드를 재사용해 N3 발행 상태의 책장 배선과 실제 찾아보기 검색을 검사한다.
      # 익명 브라우저만 쓰며 N3가 없으면 skip하지 않고 실패한다.
      - name: N3 발행 책장·찾아보기 (프로덕션 앱 · 익명)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://e2e.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: e2e-anon-key
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
          E2E_PUBLISHED_EDITION: 8a8c1c1fd452773810abaf8c
          E2E_PUBLISHED_BOOKS: japanese-n3
          COMPOSER_BASE_URL: http://127.0.0.1:8880
        run: |
          export NODE_OPTIONS="--import=$PWD/e2e/server-fetch-mock.mjs"
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 8880 > /tmp/book-n3-server.log 2>&1 &
          n3_server_pid=$!
          cleanup_n3() {
            n3_step_status=$?
            kill "$n3_server_pid" 2>/dev/null || true
            wait "$n3_server_pid" 2>/dev/null || true
            if [ "$n3_step_status" -ne 0 ]; then tail -n 100 /tmp/book-n3-server.log >&2; fi
            exit "$n3_step_status"
          }
          trap cleanup_n3 EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8880/manifest.webmanifest > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8880/manifest.webmanifest > /dev/null
          # 책장 · 교재 첫 화면은 ISR(빌드 때 N5만 발행된 판) — 이 서버의 발행 상태(N3)로 판을 새로 만든다(GUEST-STATIC-001). 없으면 N3가 책장에 없다(실측).
          node scripts/e2e-refresh-isr.mjs http://127.0.0.1:8880 /lessons /books
          node --test --test-concurrency=1 e2e/n3-published-smoke.e2e.mjs
