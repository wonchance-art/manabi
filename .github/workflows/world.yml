# 월드(도시 geo·오버월드) 전용 검증 — 일상 게이트에서 분리했다.
#
# 근거(2026-08-19 실측, 오너 승인 P1): 전체 게이트 408s 중 world가 265s(테스트 파일
# 123/305 = 40%)를 차지했고, 이 구간의 무거운 훅이 간헐 flaky로 게이트를 두 번 막았다.
# 콘텐츠·학습·뷰어 작업 PR이 매번 이 6.8분을 기다릴 이유가 없어, world 관련 경로가
# 바뀐 PR과 main push에서만 돌린다.
name: world (도시 geo·오버월드)

on:
  push:
    branches: [main] # 병합분은 경로와 무관하게 한 번 더 전량 검증
  pull_request:
    paths:
      - 'src/components/world/**'
      - 'scripts/world/**'
      - 'public/assets/overworld/**'
      - '.github/workflows/world.yml'
      - 'package.json'

jobs:
  world:
    name: world 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Overpass 원본 스냅샷(scripts/data)은 world-data 브랜치에 분리 보관(P2).
      # 도시 파이프라인 재현 검증은 이 데이터가 있어야 성립하므로 여기서 복원한다.
      - name: world data 복원
        run: npm run world:fetch-data

      - run: npm run test:world
