<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>레터링 실험 비교</title>
<style>body{margin:0;background:#d9dce3;font-family:sans-serif;padding:24px}h1{font-size:20px;margin:0 0 4px}p.n{margin:0 0 16px;color:#555;font-size:13px}
section{margin:0 0 22px}h2{font-size:15px;margin:0 0 6px}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.c{height:130px;display:flex;align-items:center;justify-content:center}.l{background:#eef0f4}.d{background:#151b2c}
.c img{max-height:78px;max-width:86%}.sm{margin-top:6px;display:flex;gap:18px;align-items:center;font-size:12px;color:#555;background:#eef0f4;padding:6px 10px}.s{height:24px}</style></head>
<body><h1>레터링 실험 3종 — 서체 윤곽 없이 구성 규칙으로 직접 작도</h1><p class="n">열 = TONARI / となり / トナリ. 위 밝은 바탕, 아래 밤 바탕, 맨 아래 24px.</p><section><h2>L1 隣り合う字 — 이웃 글자가 획을 맞댐</h2><div class="g"><div class="c l"><img src="L1-tonariau/svg/L1-up-light.svg"></div><div class="c l"><img src="L1-tonariau/svg/L1-hira-light.svg"></div><div class="c l"><img src="L1-tonariau/svg/L1-kata-light.svg"></div><div class="c d"><img src="L1-tonariau/svg/L1-up-dark.svg"></div><div class="c d"><img src="L1-tonariau/svg/L1-hira-dark.svg"></div><div class="c d"><img src="L1-tonariau/svg/L1-kata-dark.svg"></div></div><div class="sm">24px: <img class="s" src="L1-tonariau/svg/L1-up-light.svg"><img class="s" src="L1-tonariau/svg/L1-hira-light.svg"><img class="s" src="L1-tonariau/svg/L1-kata-light.svg"></div></section><section><h2>L2 一筆 — 끊기지 않는 선 하나</h2><div class="g"><div class="c l"><img src="L2-hitofude/svg/tonari-light.svg"></div><div class="c l"><img src="L2-hitofude/svg/tonari-hira-light.svg"></div><div class="c l"><img src="L2-hitofude/svg/tonari-kata-light.svg"></div><div class="c d"><img src="L2-hitofude/svg/tonari-dark.svg"></div><div class="c d"><img src="L2-hitofude/svg/tonari-hira-dark.svg"></div><div class="c d"><img src="L2-hitofude/svg/tonari-kata-dark.svg"></div></div><div class="sm">24px: <img class="s" src="L2-hitofude/svg/tonari-small-light.svg"><img class="s" src="L2-hitofude/svg/tonari-hira-small-light.svg"><img class="s" src="L2-hitofude/svg/tonari-kata-small-light.svg"></div></section><section><h2>L3 型紙 — 오려 낸 형지와 つり 다리</h2><div class="g"><div class="c l"><img src="L3-katagami/svg/L3-TONARI-light.svg"></div><div class="c l"><img src="L3-katagami/svg/L3-tonari-hira-light.svg"></div><div class="c l"><img src="L3-katagami/svg/L3-tonari-kata-light.svg"></div><div class="c d"><img src="L3-katagami/svg/L3-TONARI-dark.svg"></div><div class="c d"><img src="L3-katagami/svg/L3-tonari-hira-dark.svg"></div><div class="c d"><img src="L3-katagami/svg/L3-tonari-kata-dark.svg"></div></div><div class="sm">24px: <img class="s" src="L3-katagami/svg/L3-TONARI-s-light.svg"><img class="s" src="L3-katagami/svg/L3-tonari-hira-s-light.svg"><img class="s" src="L3-katagami/svg/L3-tonari-kata-s-light.svg"></div></section></body></html>
