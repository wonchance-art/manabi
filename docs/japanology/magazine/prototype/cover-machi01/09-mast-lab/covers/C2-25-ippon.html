  색(2색 + 바탕)
  - 바탕 snow #eef0f4 — 재단까지. 틀 없음.
  - night #151b2c(吉田の火祭 밤·먹): 모든 글자, 산 능선. night/snow 15.0:1.
  - vermilion #d4462a(北口本宮冨士浅間神社 丹塗り 大鳥居의 색): 富士みち 선·제호 괄호만. vermilion/snow 3.91:1 → 글자에는 쓰지 않는다.
  - 金鳥居 도리이 윤곽은 night — 실물 金鳥居는 銅張りのコンクリート(観光庁 多言語解説文 001553179)라 주홍으로 칠하지 않는다.

  출처
  - 富士みち 중심선: © OpenStreetMap contributors（ODbL 1.0）, Overpass osm_base 2026-07-28 11:16 KST, way 169802151,93860688,110252410,1383654947,110253316,1185885234,110253372,110252217,1534791928,40796636,653388309.
    위 끝 = OSM 富士みち 남단 노드 2097712407(上宿交差点) (136.42, 106.62). 아래 = 재단 y300에서 노드 사이 보간으로 자름. 직선화·회전 보정 없음.
  - 위 방향 = 金鳥居(OSM way 1482786848 중점 35.4832112, 138.7979629)에서 본 剣ヶ峯 방위 205.14°(국소 정거) —
    剣ヶ峯 35.360738, 138.727373 = 국토지리원 「日本の主な山岳標高（1003山）」 CSV 2026-03-31판. 축척 1mm = 11.3m. 산은 축척 밖 略図(능선 B안).
  - 金鳥居 도리이: 판면 (126, 200) = OSM way 1482786848 중점, rotate(6.5°) = 도로(±150m 주성분)에 직교. 笠木 11·貫 8·기둥 7mm, 일반형(특정 마크 모방 없음).
  - 부제: 観光庁 多言語解説文 「金鳥居」 「…30 メートルほど富士山に近く」(원고 B93). 「ほど」 유지.
  - 제호: 03-mast/mast-light.svg(Shippori Mincho ExtraBold 아웃라인 수정, OFL 1.1 — 그림이므로 OFL 적용 밖). 괄호 0.75mm 겹선.
  - 활자: Shippori Mincho 800(제목)·500(부제), Zen Kaku Gothic New 500(호 표기)·400(크레딧) — 모두 OFL, Google Fonts.

  1 부제 「今の金鳥居は、もとの場所より30メートルほど山に近い。」 세로 2열, 「金鳥居」를 막대 높이에, 막대 왼끝과 띄움.

/* ── 표지: A4 210×297mm, 1mm = 100cqw/210 ── */
.cover{--mm:calc(100cqw / 210);--cover-bg:#eef0f4;

.cover > *{position:absolute;margin:0}
.cover .plate{inset:0;width:100%;height:100%;display:block}
.cover .mast{left:calc(var(--mm)*13);top:calc(var(--mm)*13);width:calc(var(--mm)*52.5);height:calc(var(--mm)*68.124)}
.cover .no{left:calc(var(--mm)*12.57);top:calc(var(--mm)*30.31);font-family:'Zen Kaku Gothic New',sans-serif;font-weight:500;

.cover .sub .tcy{text-combine-upright:all}
.cover .credit{left:calc(var(--mm)*12.82);bottom:calc(var(--mm)*10);font-family:'Zen Kaku Gothic New',sans-serif;font-weight:400;
  font-size:calc(var(--mm)*3.24);line-height:1.42;white-space:nowrap;font-feature-settings:'palt'}
.cover .credit span{display:block}
.cover .no .n{margin-left:calc(var(--mm)*2.5)}

/* 09-mast-lab */
.cover .no{left:calc(var(--mm)*69.07);top:calc(var(--mm)*12.71)}
