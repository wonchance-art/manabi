  『となり』 一つの町 01 富士吉田 표지 「一本の線」 — 생성 파일(05-compose/build-cover.mjs). 손으로 고치지 말 것. 조립 2026-10-15 KST.
  검사: node docs/japanology/magazine/prototype/check-cover.cjs cover.html  (바탕 = .cover의 --cover-bg)

  색(2색 + 바탕)
  - 바탕 snow #eef0f4 — 재단까지. 틀 없음.
  - night #151b2c(吉田の火祭 밤·먹): 모든 글자, 산 능선. night/snow 15.0:1.
  - vermilion #d4462a(北口本宮冨士浅間神社 丹塗り 大鳥居의 색): 富士みち 선·金鳥居 막대·제호 괄호만. vermilion/snow 3.91:1 → 글자에는 쓰지 않는다.
    실물 金鳥居는 銅張りのコンクリート(観光庁 多言語解説文 001553179) — 막대 주홍은 경로 표시색이지 鳥居 색이 아니다.

  출처
  - 富士みち 중심선: © OpenStreetMap contributors（ODbL 1.0）, Overpass osm_base 2026-07-28 11:16 KST, way 169802151,93860688,110252410,1383654947,110253316,1185885234,110253372,110252217,1534791928,40796636,653388309.
    위 끝 = OSM 富士みち 남단 노드 2097712407(上宿交差点) (135.13, 118.2). 아래 = 재단 y300에서 노드 사이 보간으로 자름. 직선화·회전 보정 없음.
  - 위 방향 = 金鳥居(OSM way 1482786848 중점 35.4832112, 138.7979629)에서 본 剣ヶ峯 방위 205.14°(국소 정거) —
    剣ヶ峯 35.360738, 138.727373 = 국토지리원 「日本の主な山岳標高（1003山）」 CSV 2026-03-31판. 축척 1mm = 12.9m. 산은 축척 밖 略図(능선 B안).
  - 金鳥居 막대: 판면 (126, 200), 18×2.4mm, rotate(6.5°) = 도로(±150m 주성분)에 직교.
  - 부제: 観光庁 多言語解説文 「金鳥居」 「…30 メートルほど富士山に近く」(원고 B93). 「ほど」 유지.
  - 제호: 03-mast/mast-light.svg(Shippori Mincho ExtraBold 아웃라인 수정, OFL 1.1 — 그림이므로 OFL 적용 밖). 괄호 0.75mm 겹선.
  - 활자: Shippori Mincho 800(제목)·500(부제), Zen Kaku Gothic New 500(호 표기)·400(크레딧) — 모두 OFL, Google Fonts.

  편집장 결정(2026-10-15 KST)
  1 부제 「今の金鳥居は、もとの場所より30メートルほど山に近い。」 세로 2열, 「金鳥居」를 막대 높이에, 막대 왼끝과 띄움.
  2 산정 = 국토지리원 剣ヶ峯, build-line.mjs 사본으로 재투영. 3 능선 B안. 4 제호 (13,13) 16mm.
  5 명조(제호 외 제목·부제)/고딕(호 표기·크레딧). 6 크레딧 3줄 내용(인쇄 URL 포함), 3.4mm.
  7 틀 없음·2색·주홍 글자 금지. 8 --mm = 100cqw/210(cqi 금지). 9 요소 7개.

:root{--night:#151b2c;--vermilion:#d4462a;--snow:#eef0f4;--page:#d9dce3;--page-ink:#151b2c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#0e1220;--page-ink:#eef0f4}}
:root[data-theme="dark"]{--page:#0e1220;--page-ink:#eef0f4}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--page-ink)}
body{padding:16px}
.wrap{max-width:860px;margin:0 auto;container-type:inline-size}

/* ── 표지: A4 210×297mm, 1mm = 100cqw/210 ── */
.cover{--mm:calc(100cqw / 210);--cover-bg:#eef0f4;
  width:100%;aspect-ratio:210/297;position:relative;overflow:hidden;background:var(--cover-bg);color:var(--night)}
.cover > *{position:absolute;margin:0}
.cover .plate{inset:0;width:100%;height:100%;display:block}
.cover .mast{left:calc(var(--mm)*13);top:calc(var(--mm)*13);width:calc(var(--mm)*32.87);height:calc(var(--mm)*16)}
.cover .no{left:calc(var(--mm)*12.57);top:calc(var(--mm)*33.5);font-family:'Zen Kaku Gothic New',sans-serif;font-weight:500;
  font-size:calc(var(--mm)*5.64);line-height:1;letter-spacing:.08em;font-variant-numeric:tabular-nums;white-space:nowrap}
.cover .ttl{left:calc(var(--mm)*150);top:calc(var(--mm)*117.67);writing-mode:vertical-rl;font-family:'Shippori Mincho',serif;font-weight:800;
  font-size:calc(var(--mm)*14.11);line-height:1;letter-spacing:0.04em;white-space:nowrap}
.cover .sub{right:calc(var(--mm)*94.4);top:calc(var(--mm)*178);writing-mode:vertical-rl;font-family:'Shippori Mincho',serif;font-weight:500;
  font-size:calc(var(--mm)*6);line-height:1.7;letter-spacing:0;white-space:nowrap}
.cover .sub .tcy{text-combine-upright:all}
.cover .credit{left:calc(var(--mm)*12.81);bottom:calc(var(--mm)*10);font-family:'Zen Kaku Gothic New',sans-serif;font-weight:400;
  font-size:calc(var(--mm)*3.4);line-height:1.5;white-space:nowrap;font-feature-settings:'palt'}
.cover .credit span{display:block}
.cover .credit .hang{text-indent:-.5em} /* 行頭の『 — 全角括弧の左アキ半角を詰め、잉크 왼끝을 x13에 맞춤(Zen Kaku는 palt 미적용 확인) */
</style>
