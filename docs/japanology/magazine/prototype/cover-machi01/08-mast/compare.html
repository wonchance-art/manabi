<h1>『となり』 제호 — 괄호 없는 다섯 안</h1>
<p>모두 아웃라인 SVG(서체 &lt;text&gt; 없음). 표지는 07-refine 원본의 복사본에서 제호·호 표기 위치만 바꿨다. 각 칸 = 실제 390px 표지.</p>
<h2>제호만 — 390px 표지 축척(명·암) · 16mm 실제 크기 비율(96dpi)</h2>
