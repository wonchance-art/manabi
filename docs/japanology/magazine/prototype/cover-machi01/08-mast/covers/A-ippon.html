  색(2색 + 바탕)
  - 바탕 snow #eef0f4 — 재단까지. 틀 없음.
  - night #151b2c(吉田の火祭 밤·먹): 모든 글자, 산 능선. night/snow 15.0:1.
  - vermilion #d4462a(北口本宮冨士浅間神社 丹塗り 大鳥居의 색): 富士みち 선·제호 괄호만. vermilion/snow 3.91:1 → 글자에는 쓰지 않는다.
  - 金鳥居 도리이 윤곽은 night — 실물 金鳥居는 銅張りのコンクリート(観光庁 多言語解説文 001553179)라 주홍으로 칠하지 않는다.

  출처
  - 富士みち 중심선: © OpenStreetMap contributors（ODbL 1.0）, Overpass osm_base 2026-07-28 11:16 KST, way 169802151,93860688,110252410,1383654947,110253316,1185885234,110253372,110252217,1534791928,40796636,653388309.

  - 위 방향 = 金鳥居(OSM way 1482786848 중점 35.4832112, 138.7979629)에서 본 剣ヶ峯 방위 205.14°(국소 정거) —
    剣ヶ峯 35.360738, 138.727373 = 국토지리원 「日本の主な山岳標高（1003山）」 CSV 2026-03-31판. 축척 1mm = 11.3m. 산은 축척 밖 略図(능선 B안).
  - 金鳥居 도리이: 판면 (126, 200) = OSM way 1482786848 중점, rotate(6.5°) = 도로(±150m 주성분)에 직교. 笠木 11·貫 8·기둥 7mm, 일반형(특정 마크 모방 없음).

  - 제호: 03-mast/mast-light.svg(Shippori Mincho ExtraBold 아웃라인 수정, OFL 1.1 — 그림이므로 OFL 적용 밖). 괄호 0.75mm 겹선.
