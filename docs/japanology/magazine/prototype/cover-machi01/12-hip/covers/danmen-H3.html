  레이아웃은 11-center와 같다: 모든 글자 상자 left 14mm · right 14mm · text-align center(축 x105).
  서체 체계 H3 ドット(픽셀 고딕 한 벌(제호·제목) + 읽는 고딕 + 기하 그로테스크 숫자): DotGothic16 · Zen Kaku Gothic New · Space Grotesk — 모두 Google Fonts, SIL OFL 1.1(확인 표 NOTES.md).

  색: 바탕 #151b2c · 글자 #eef0f4 · 주홍 #d4462a는 그림의 한 곳(비글자)에만.
  주인공 ⑤断面: 07-refine/05-danmen/data.json 그대로(国土地理院 標高API（getelevation.php）https://cyberjapandata2.gsi.go.jp/general/dem/scripts/getelevation.php; 열람 2026-10-15 13:09:17 KST·2026-10-15 13:15:37 KST·2026-10-15 15:04:07 KST). 縦横同縮尺 10.9936mm/km, 밑변 y258, 위치·형상 불변.
