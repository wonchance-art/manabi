  『となり』 一つの町 01 富士吉田 — 12-hip 표지 ippon-H4 · 생성 파일(12-hip/build.mjs). 손으로 고치지 말 것. 2026-10-15 KST.
  레이아웃은 11-center와 같다: 모든 글자 상자 left 14mm · right 14mm · text-align center(축 x105).
  서체 체계 H4 筆(붓글씨 한 벌(제호·제목) + 둥근 고딕 + 교과서체): Yuji Syuku · Zen Maru Gothic · Klee One — 모두 Google Fonts, SIL OFL 1.1(확인 표 NOTES.md).
  제호(탐색 단계 라이브 텍스트): TONARI 35.972mm(잉크 폭 151.585mm) · となり 10.455mm. 큰 글자 3역할은 같은 woff2를 ascent/descent-override로 다시 선언(상자 = 잉크 높이).
  색: 바탕 #eef0f4 · 글자 #151b2c · 주홍 #d4462a는 그림의 한 곳(비글자)에만.
  주인공 ①一本の線: 10-mh와 같은 투영(축척 11.3m/mm·剣ヶ峯 방위가 위·직선화/회전/좌우 이동 없음), 金鳥居 y247.698·꼭짓점 y140.298로 평행 이동.
    선은 上宿 (136.42, 154.32)에서 金鳥居 아래 y251.098까지만 그린다 — 가운데 정렬한 문장·크레딧이 선과 겹치지 않게 데이터를 자른 것(형상 불변).
    © OpenStreetMap contributors（ODbL）, osm_base 2026-07-28 11:16 KST.
  문구: 聖なる町と俗なる町 = 원고 46행(A17 山梨県) · 金鳥居 30メートルほど = 20·74행(B93 観光庁, 도리이 바로 아래).
-->
