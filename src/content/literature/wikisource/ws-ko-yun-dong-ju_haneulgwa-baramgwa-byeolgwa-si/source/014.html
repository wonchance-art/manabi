<span><span class="pagenum ws-pagenum" id="32" data-page-number="32" data-page-name="페이지:윤동주 하늘과 바람과 별과 시 (초판본, 1948).pdf/32" data-page-index="32" data-page-quality="1" title="%ED%8E%98%EC%9D%B4%EC%A7%80:%EC%9C%A4%EB%8F%99%EC%A3%BC_%ED%95%98%EB%8A%98%EA%B3%BC_%EB%B0%94%EB%9E%8C%EA%B3%BC_%EB%B3%84%EA%B3%BC_%EC%8B%9C_(%EC%B4%88%ED%8C%90%EB%B3%B8,_1948).pdf/32"><span id="pageindex_32" class="pagenum-inner ws-noexport">​</span></span></span><div class="tiInherit" style="text-align:center;">
<p><span style="font-size:120%;">바람이 불어</span>
</p>
</div>
<div class="poem">
<p>바람이 어디로부터 불어와<br>
어디로 불려가는 것일까,<br>
<br>
바람이 부는데<br>
내 괴로움에는 理由가 없다.<br>
<br>
내 괴로움에는 理由가 없을까.<br>
<br>
단 한女子를 사랑한 일도 없다.<br>
時代를 슬퍼한 일도 없다.<br>
<br>
바람이 자꼬 부는데<br>
내발이 반석우에 섰다.
</p>
</div>

<p>강물이 자꼬 흐르는데<br>
내발이 언덕우에 섰다.
</p>
</div>
