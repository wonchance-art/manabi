<p><span style="font-size:144%;">빨래</span>

<p>빨래줄에 두 다리를 드리우고<br>
횐 빨래들이 귓속 이야기 하는 午後,<br><br>
쨍쨍한 七月햇발은 고요히도<br>
아담한 빨래에만 달린다.
</p>
