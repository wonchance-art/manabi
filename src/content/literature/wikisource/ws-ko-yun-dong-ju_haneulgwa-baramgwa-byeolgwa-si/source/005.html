<p><span style="font-size:120%;">돌아와 보는 밤</span>
</p>
</div>
<div class="poem">
<p>세상으로부터 돌아오듯이 이제 내 좁은 방에 돌아와 불을 끄옵니다. 불을 켜두는것은 너무나 괴로롭은 일이옵니다. 그것은 낮의 延長이옵기에―<br>
&nbsp;<br>
이제 窓을 열어 空氣를 바꾸어 들여야할터인데 밖을 가만히 내다 보아야 房안과 같이 어두어 꼭 세상같은데 비를 맞고 오든 길이 그대로 비속에 젖어 있사옵니다.<br>
&nbsp;<br>
하로의 울분을 씻을바 없어 가만히 눈을 감으면 마음속으로 흐르는 소리, 이제, 思想이 능금처럼 저절로 익어 가옵니다.
</p>
