<p>세상으로부터 돌아오듯이 이제 내 좁은 방에 돌아와 불을 끄옵니다. 불을 켜 두는 것은 너무나 피로롭은 일이옵니다. 그것은 낮의 延長이옵기에<span style="text-decoration:line-through;"><span style="color:transparent !important;">——</span></span><br><br>
이제 窓을 열어 空氣를 바꾸어 들여야 할텐데 밖을 가만히 내다 보아야 房안과같이 어두어 꼭 세상같은데 비를 맞고 오든 길이 그대로 비속에 젖어 있사옵니다.<br><br>
하로의 울분을 씻을바 없어 가만히 눈을 감으면 마음<span><span class="pagenum ws-pagenum" id="13" data-page-number="13" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/16" data-page-index="16" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/16"><span id="pageindex_16" class="pagenum-inner ws-noexport">​</span></span></span>속으로 흐르는 소리, 이제 思想이 능금처럼 저절로 익어 가옵니다.
</p>
