<p><span style="font-size:144%;">아침</span>
</p>
</div><br>
<p>휙, 휙, 휙,<br>
소꼬리가 부드러운 채찍질로<br>
어둠을 쫓아,<br>
캄, 캄, 어둠이 깊다깊다 밝으오.<br><br>
이제 이 洞里의 아침이<br>
풀살 오른 소엉덩이처럼 푸드오.<br>
이 洞里 콩죽 먹은 사람들이<br>
땀물을 뿌려 이 여름을 길렀오.<br> <span><span class="pagenum ws-pagenum" id="99" data-page-number="99" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/102" data-page-index="102" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/102"><span id="pageindex_102" class="pagenum-inner ws-noexport">​</span></span></span>잎, 잎, 풀잎마다 땀방울이 맺혔오.<br><br>
구김살 없는 이 아침을<br>
深呼吸하오 또 하오.
</p>
