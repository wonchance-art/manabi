<p><span style="font-size:120%;">새벽이 올때까지</span>
</p>
</div>
<div class="poem">
<p>다들 죽어가는 사람들에게<br>
검은 옷을 입히시요.<br>
<br>
다들 살어가는 사람들에게<br>
흰 옷을 입히시요.<br>
<br>
그리고 한 寢室에<br>
가즈런히 잠을 재우시요.<br>
<br>
다들 울거들랑<br>
젖을 먹이시오.<br>
<br>
이제 새벽이 오면<br>
나팔소리 들려 올게외다.
</p>
</div>
