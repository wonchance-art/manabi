<p><span style="font-size:144%;">蒼空</span>
</p>
</div><br>
<p>그 여름날<br>
熱情의 포푸라는<br>
오려는 蒼空의 푸른 젖가슴을<br>
어루만지려<br>
팔을 펼쳐 흔들거렸다.<br>
끓는 太陽그늘 좁다란 地點에서<br>
天幕같은 하늘밑에서<br>
떠들던, 소나기<br>
그리고 번개를,<br> <span><span class="pagenum ws-pagenum" id="119" data-page-number="119" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/122" data-page-index="122" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/122"><span id="pageindex_122" class="pagenum-inner ws-noexport">​</span></span></span>춤추든 구름은 이끌고<br>
南方으로 도망하고,<br>
높다랗게 蒼空은 한폭으로<br>
가지우에 퍼지고<br>
둥근달과 기러기를 불러왔다.<br><br>
푸드른 어린마음이 理想에 타고,<br>
그의 憧憬의날 가을에<br>
凋落의 눈물을 비웃다.
</p>
