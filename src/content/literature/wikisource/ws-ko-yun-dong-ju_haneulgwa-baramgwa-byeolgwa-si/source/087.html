<p><span style="font-size:144%;">조개껍질</span>

<p>아롱아롱 조개껍대기<br>
울언니 바다가에서<br>
주어온 조개껍대기<br><br>
여긴여긴 북쪽나라요<br>
조개는 귀여운선물<br>
장난감 조개껍대기<br><br>
데굴데굴 굴리며놀다<br> <span><span class="pagenum ws-pagenum" id="161" data-page-number="161" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/164" data-page-index="164" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/164"><span id="pageindex_164" class="pagenum-inner ws-noexport">​</span></span></span>짝잃은 조개껍대기<br>
한짝을 그리워하네<br><br>
아롱아롱 조개껍대기<br>
나처럼 그리워하네<br>
물소리 바다물소리.
</p>
