<p><span style="font-size:120%;">遺言</span>
</p>
</div>
<div class="poem">
<p>후어—ㄴ한 房에<br>
遺言은 소리없는 입놀림.<br>
<br>
―바다에 眞珠캐려 갔다는 아들<br>
海女와 사랑을 속사긴다는 맏아들,<br>
이밤에사 돌아오나 내다봐라—<br>
<br>
平生 외롭든 아버지의 殞命<br>
감기우는 눈에 슬픔이 어린다.<br>
<br>
외딴집에 개가 짖고<br>
휘양찬 달이 문살에 흐르는 밤.
</p>
