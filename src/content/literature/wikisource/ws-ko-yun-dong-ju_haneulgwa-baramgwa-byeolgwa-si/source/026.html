<p><span style="font-size:144%;">肝</span>
</p>
</div>
<div style="visibility:hidden; line-height:100%;">&nbsp;</div>
<div style="float:left; width:auto; text-align:inherit;">
<p>바닷가 햇빛 바른 바위우에<br>
습한 肝을 펴서 말리우자,<br><br>
코카사쓰山中에서 도망해온 토끼처럼<br>
둘러리를 빙빙 돌며 肝을 지키자,<br><br>
내가 오래 기르든 여윈 독수리야!<br>
와서 뜯어 먹어라, 시름없이<br><br> <span><span class="pagenum ws-pagenum" id="59" data-page-number="59" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/62" data-page-index="62" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/62"><span id="pageindex_62" class="pagenum-inner ws-noexport">​</span></span></span>너는 살지고<br>
나는 여위여야지, 그러나,<br><br>
거북이야!<br>
다시는 龍宮의 誘惑에 안떨어진다.<br><br>
푸로메디어쓰 불상한 푸로메디어쓰<br>
불 도적한 죄로 목에 맷돌을 달고<br>
끝없이 沈澱하는 푸로메디어쓰,
</p>
