<p><span style="font-size:120%;">밤</span>
</p>
</div>
<div class="poem">
<p>오양간 당나귀<br>
아—ㅇ 앙 외마디 울음울고,<br>
<br>
당나귀 소리에<br>
으—아 아 애기 소스라처깨고,<br>
<br>
등잔에 불을 다오.<br>
<br>
아버지는 당나귀에게<br>
짚을 한키 담아주고,<br>
<br>
어머니는 애기에게<br>
젖을 한목음 먹이고,<br>
<br>
밤은 다시 고요히 잠드오.
</p>
