<span><span class="pagenum ws-pagenum" id="56" data-page-number="56" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/59" data-page-index="59" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/59"><span id="pageindex_59" class="pagenum-inner ws-noexport">​</span></span></span><div class="tiInherit" style="text-align:center;">
<p><span style="font-size:144%;">懺悔錄</span>
</p>
</div>
<div style="visibility:hidden; line-height:100%;">&nbsp;</div>
<div style="float:left; width:auto; text-align:inherit;">
<p>파란 녹이 낀 구리거울속에<br>
내 얼굴이 남어 있는 것은<br>
어느 王朝의 遺物이기에<br>
이다지도 욕될가<br><br>
나는 나의 懺悔의 글을 한줄에 주리자<br>
<span style="text-decoration:line-through;"><span style="color:transparent !important;">——</span></span>滿二十四年一個月을<br>
<span style="display:inline-block; inline-size:2em"></span>무슨 기쁨을 바라 살아 왔든가<br><br> <span><span class="pagenum ws-pagenum" id="57" data-page-number="57" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/60" data-page-index="60" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/60"><span id="pageindex_60" class="pagenum-inner ws-noexport">​</span></span></span>내일이나 모레나 그 어느 즐거운 날에<br>
나는 또 한줄의 懺悔錄을 써야한다.<br>
<span style="text-decoration:line-through;"><span style="color:transparent !important;">——</span></span>그때 그 젊은 나이에<br>
<span style="display:inline-block; inline-size:2em"></span>웨 그런 부끄런 告白을 했든가<br><br>
밤이면 밤마다 나의 거울을<br>
손바닥으로 발바닥으로 닦어 보자.<br><br>
그러면 어느 隕石밑으로 흘로 걸어가는<br>
슬픈 사람의 뒷모양이<br>
거울속에 나타나온다.
</p>
