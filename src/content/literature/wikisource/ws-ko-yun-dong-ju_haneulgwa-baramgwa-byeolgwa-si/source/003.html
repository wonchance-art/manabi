<span><span class="pagenum ws-pagenum" id="18" data-page-number="18" data-page-name="페이지:윤동주 하늘과 바람과 별과 시 (초판본, 1948).pdf/18" data-page-index="18" data-page-quality="1" title="%ED%8E%98%EC%9D%B4%EC%A7%80:%EC%9C%A4%EB%8F%99%EC%A3%BC_%ED%95%98%EB%8A%98%EA%B3%BC_%EB%B0%94%EB%9E%8C%EA%B3%BC_%EB%B3%84%EA%B3%BC_%EC%8B%9C_(%EC%B4%88%ED%8C%90%EB%B3%B8,_1948).pdf/18"><span id="pageindex_18" class="pagenum-inner ws-noexport">​</span></span></span><div class="tiInherit" style="text-align:center;">
<p><span style="font-size:120%;">少年</span>
</p>
</div>
<div class="poem">
<p>여기저기서 단풍잎 같은 슬픈가을이 뚝뚝 떨어진다. 단풍잎 떨어저 나온 자리마다 봄을 마련해 놓고 나무가지 우에 하늘이 펼처있다. 가만이 하늘을 들여다 보려면 눈섭에 파란 물감이 든다. 두손으로 따뜻한 볼을 쓰서보면 손바닥에도 파란 물감이 묻어난다. 다시 손바닥을 들여다 본다. 손금에는 맑은 강물이 흐르고, 맑은 강물이 흐르고, 강물속에는 사랑처럼 슬픈얼골― 아름다운 順伊의 얼골이 어린다. 少年은 황홀이 눈을 감어 본다. 그래도 맑은 강물은 흘러 사랑처럼 슬픈얼골― 아름다운 順伊의 얼골은 어린다.
</p>
</div>
