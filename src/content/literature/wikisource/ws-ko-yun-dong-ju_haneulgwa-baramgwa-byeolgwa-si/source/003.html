<p><span style="font-size:144%;">少年</span>
</p>
</div>
<div style="visibility:hidden; line-height:100%;">&nbsp;</div>
<div style="float:left; width:auto; text-align:inherit;">
<p>여기저기서 단풍잎 같은 슬픈가을이 뚝뚝 떨어진다. 단풍잎 떨어져 나온 자리마다 봄을 마련해 놓고 나무가지 우에 하늘이 펼쳐있다. 가만히 하늘을 들여다 보려면 눈섭에 파란 물감이 든다. 두 손으로 따뜻한 볼을 씃어보면 손바닥에도 파란 물감이 묻어난다. 다시 손바닥을 들여다 본다. 손금에는 맑은 강물이 흐르고, 맑은 강물이 흐르고, 강물속에는 사랑처럼 슬픈얼골<span style="text-decoration:line-through;"><span style="color:transparent !important;">——</span></span>아름다운 順伊의 얼골이 어린다. 少年은 황홀히 눈을 감어 본<span><span class="pagenum ws-pagenum" id="9" data-page-number="9" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/12" data-page-index="12" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/12"><span id="pageindex_12" class="pagenum-inner ws-noexport">​</span></span></span>다. 그래도 맑은 강물은 흘러 사랑처럼 슬픈얼골<span style="text-decoration:line-through;"><span style="color:transparent !important;">——</span></span>아름다운 順伊의 얼골은 어린다.
</p>
