<p><span style="font-size:144%;">山上</span>
</p>
</div><br>
<p>거리가 바둑판처럼 보이고,<br>
江물이 배암의 새끼처럼 기는<br>
山우에까지 왔다.<br>
아직쯤은 사람들이<br>
바둑돌처럼 버려있으리라.<br><br>
한나절의 太陽이<br>
함석지붕에만 비치고,<br>
굼벙이 걸음을 하든 汽車가<br> <span><span class="pagenum ws-pagenum" id="107" data-page-number="107" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/110" data-page-index="110" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/110"><span id="pageindex_110" class="pagenum-inner ws-noexport">​</span></span></span>停車場에 섰다가 검은 내를 吐하고<br>
또 걸음발을 탄다.<br><br>
텐트같은 하늘이 무너져<br>
이 거리를 덮을가 궁금하면서<br>
좀더 높은데로 올라가고 싶다.<br>
</p>
