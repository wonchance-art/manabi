<p>오양간 당나귀<br>
아—ㅇ 외 마디 울음울고,<br><br>
당나귀 소리에<br>
으—아 아 애기 소스라처 깨고,<br><br>
등잔에 불을 다오.<br><br>
아버지는 당나귀에게<br> <span><span class="pagenum ws-pagenum" id="95" data-page-number="95" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/98" data-page-index="98" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/98"><span id="pageindex_98" class="pagenum-inner ws-noexport">​</span></span></span>짚을 한키 담아 주고,<br><br>
어머니는 애기에게<br>
젖을 한모금 먹이고,<br><br>
밤은 다시 고요히 잠드오.
</p>
