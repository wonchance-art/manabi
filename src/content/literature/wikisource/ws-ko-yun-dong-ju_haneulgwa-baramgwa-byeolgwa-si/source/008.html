<span><span class="pagenum ws-pagenum" id="24" data-page-number="24" data-page-name="페이지:윤동주 하늘과 바람과 별과 시 (초판본, 1948).pdf/24" data-page-index="24" data-page-quality="1" title="%ED%8E%98%EC%9D%B4%EC%A7%80:%EC%9C%A4%EB%8F%99%EC%A3%BC_%ED%95%98%EB%8A%98%EA%B3%BC_%EB%B0%94%EB%9E%8C%EA%B3%BC_%EB%B3%84%EA%B3%BC_%EC%8B%9C_(%EC%B4%88%ED%8C%90%EB%B3%B8,_1948).pdf/24"><span id="pageindex_24" class="pagenum-inner ws-noexport">​</span></span></span><div class="tiInherit" style="text-align:center;">
<p><span style="font-size:120%;">看板없는 거리</span>
</p>
</div>
<div class="poem">
<p>停車場 푸렡폼에<br>
나렸을 때 아무도 없어.<br>
&nbsp;<br>
다들 손님들뿐.<br>
손님같은 사람들뿐.<br>
&nbsp;<br>
집집마다 看板이 없어<br>
집 찾을 근심이 없어<br>
&nbsp;<br>
빨갛게<br>
파랗게<br>
불 붙는 文字도 없이<br>
&nbsp;<br>
모퉁이마다
</p>
</div> <span><span class="pagenum ws-pagenum" id="25" data-page-number="25" data-page-name="페이지:윤동주 하늘과 바람과 별과 시 (초판본, 1948).pdf/25" data-page-index="25" data-page-quality="1" title="%ED%8E%98%EC%9D%B4%EC%A7%80:%EC%9C%A4%EB%8F%99%EC%A3%BC_%ED%95%98%EB%8A%98%EA%B3%BC_%EB%B0%94%EB%9E%8C%EA%B3%BC_%EB%B3%84%EA%B3%BC_%EC%8B%9C_(%EC%B4%88%ED%8C%90%EB%B3%B8,_1948).pdf/25"><span id="pageindex_25" class="pagenum-inner ws-noexport">​</span></span></span><div class="poem">
<p>慈愛로운 헌 瓦斯燈에<br>
불을 혀놓고,<br>
&nbsp;<br>
손목을 잡으면<br>
다들, 어진사람들<br>
다들, 어진사람들<br>
&nbsp;<br>
봄, 여름, 가을, 겨울,<br>
순서로 돌아들고.
</p>
</div>
