<div style="float:left; width:auto; text-align:inherit;">
<p>停車場 푸랱폼에<br>
나렸을 때 아무도 없어,<br><br>
다들 손님들뿐,<br>
손님같은 사람들뿐,<br><br>
집집마다 看板이 없어<br>
집 찾을 근심이 없어<br><br>
빨갛게<br> <span><span class="pagenum ws-pagenum" id="19" data-page-number="19" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/22" data-page-index="22" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/22"><span id="pageindex_22" class="pagenum-inner ws-noexport">​</span></span></span>파랗게<br>
불 붙는 文字도 없이<br><br>
모퉁이마다<br>
慈愛로운 헌 瓦斯燈에<br>
불을 혀놓고,<br><br>
손목을 잡으면<br>
다들, 어진사람들<br>
다들, 어진사람들<br><br>
봄, 여름, 가을, 겨을,<br>
순서로 돌아들고.
</p>
