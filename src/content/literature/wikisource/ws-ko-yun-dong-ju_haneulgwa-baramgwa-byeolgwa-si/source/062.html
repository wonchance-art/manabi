<p><span style="font-size:144%;">南쪽 하늘</span>
</p>
</div><br>
<p>제비는 두 나래를 가지었다.<br>
시산한 가을날<span style="text-decoration:line-through;"><span style="color:transparent !important;">——</span></span><br><br>
어머니의 젖가슴이 그리운<br>
서리 나리는 저녁<span style="text-decoration:line-through;"><span style="color:transparent !important;">——</span></span><br>
어린 靈은 쪽나래의 鄕愁를 타고<br>
南쪽 하늘에 떠 돌뿐<span style="text-decoration:line-through;"><span style="color:transparent !important;">——</span></span>
</p>
