<span><span class="pagenum ws-pagenum" id="59" data-page-number="59" data-page-name="페이지:윤동주 하늘과 바람과 별과 시 (초판본, 1948).pdf/59" data-page-index="59" data-page-quality="1" title="%ED%8E%98%EC%9D%B4%EC%A7%80:%EC%9C%A4%EB%8F%99%EC%A3%BC_%ED%95%98%EB%8A%98%EA%B3%BC_%EB%B0%94%EB%9E%8C%EA%B3%BC_%EB%B3%84%EA%B3%BC_%EC%8B%9C_(%EC%B4%88%ED%8C%90%EB%B3%B8,_1948).pdf/59"><span id="pageindex_59" class="pagenum-inner ws-noexport">​</span></span></span><div class="tiInherit" style="text-align:center;">
<p><span style="font-size:120%;">肝</span>
</p>
</div>
<div class="poem">
<p>바닷가 햇빛 바른 바위우에<br>
습한 肝을 펴서 말리우자.<br>
<br>
코카사쓰 山中에서 도망해 온 토끼처럼<br>
둘러리를 빙빙 돌며 肝을 지키자,<br>
<br>
내가 오래 기르든 여윈 독수리야!<br>
와서 뜯어먹어라, 시름없이<br>
<br>
너는 살지고<br>
나는 여위여야지, 그러나,<br>
<br>
거북이야!<br>
다시는 龍宮의 誘惑에 안떨어진다.
</p>
</div>

<p>푸로메디어쓰 불상한 푸로메디어쓰<br>
불 도적한 죄로 목에 맷돌을 달고<br>
끝없이 沈澱하는 푸로메디어쓰.
</p>
