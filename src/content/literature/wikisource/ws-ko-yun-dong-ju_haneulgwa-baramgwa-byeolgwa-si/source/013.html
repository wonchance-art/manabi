<p><span style="font-size:144%;">十字架</span>
</p>
</div>
<div style="visibility:hidden; line-height:100%;">&nbsp;</div>
<div style="float:left; width:auto; text-align:inherit;">
<p>쫓아오든 햇빛인데<br>
지금 敎會堂 꼭대기<br>
十字架에 걸리었읍니다.<br><br>
尖塔이 저렇게도 높은데<br>
어떻게 올라갈수 있을까요.<br><br>
鍾소리도 들려오지 않는데<br>
휘파람이나 불며 서성거리다가,<br><br> <span><span class="pagenum ws-pagenum" id="29" data-page-number="29" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/32" data-page-index="32" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/32"><span id="pageindex_32" class="pagenum-inner ws-noexport">​</span></span></span>괴로웠든 사나이,<br>
幸福한 예수•그리스도에게<br>
처럼<br>
十字架가 許諾된다면<br><br>
목아지를 드리우고<br>
꽃처럼 피어나는 피를<br>
어두어가는 하늘 밑에<br>
조용히 흘리겠읍니다.
</p>
