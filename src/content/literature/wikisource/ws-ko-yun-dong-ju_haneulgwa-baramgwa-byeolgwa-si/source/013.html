<span><span class="pagenum ws-pagenum" id="30" data-page-number="30" data-page-name="페이지:윤동주 하늘과 바람과 별과 시 (초판본, 1948).pdf/30" data-page-index="30" data-page-quality="1" title="%ED%8E%98%EC%9D%B4%EC%A7%80:%EC%9C%A4%EB%8F%99%EC%A3%BC_%ED%95%98%EB%8A%98%EA%B3%BC_%EB%B0%94%EB%9E%8C%EA%B3%BC_%EB%B3%84%EA%B3%BC_%EC%8B%9C_(%EC%B4%88%ED%8C%90%EB%B3%B8,_1948).pdf/30"><span id="pageindex_30" class="pagenum-inner ws-noexport">​</span></span></span><div class="tiInherit" style="text-align:center;">
<p><span style="font-size:120%;">十字架</span>
</p>
</div>
<div class="poem">
<p>쫓아오든 햇빛인데<br>
지금 敎會堂 꼭대기<br>
十字架에 걸리었습니다.<br>
<br>
尖塔이 저렇게도 높은데<br>
어떻게 올라갈수 있을가요.<br>
<br>
鐘소리도 들려오지 않는데<br>
휘파람이나 불며 서성거리다가,<br>
<br>
괴로왔든 사나이.<br>
幸福한 예수 • 그리스도에게<br>
처럼<br>
十字架가 許諾된다면
</p>
</div>
<div class="__nop wst-nop"></div>
 <span><span class="pagenum ws-pagenum" id="31" data-page-number="31" data-page-name="페이지:윤동주 하늘과 바람과 별과 시 (초판본, 1948).pdf/31" data-page-index="31" data-page-quality="1" title="%ED%8E%98%EC%9D%B4%EC%A7%80:%EC%9C%A4%EB%8F%99%EC%A3%BC_%ED%95%98%EB%8A%98%EA%B3%BC_%EB%B0%94%EB%9E%8C%EA%B3%BC_%EB%B3%84%EA%B3%BC_%EC%8B%9C_(%EC%B4%88%ED%8C%90%EB%B3%B8,_1948).pdf/31"><span id="pageindex_31" class="pagenum-inner ws-noexport">​</span></span></span><div class="poem">
<p>목아지를 드리우고<br>
꽃처럼 피여나는 피를<br>
어두어가는 하늘밑에<br>
조용히 흘리겠습니다.
</p>
</div>
