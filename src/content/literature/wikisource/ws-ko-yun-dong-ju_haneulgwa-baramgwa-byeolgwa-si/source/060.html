<p>안아보고싶게 귀여운<br>
산비들기 일곱마리<br>
하늘끝까지 보일듯이 맑은 공일날 아침에<br>
벼를 거두어 빤빤한 논에<br>
앞을 다투어 모이를 주으며<br>
어려운 이야기를 주고 받으오<br><br>
날신한 두나래로 조용한 공기를 흔들어<br> <span><span class="pagenum ws-pagenum" id="115" data-page-number="115" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/118" data-page-index="118" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/118"><span id="pageindex_118" class="pagenum-inner ws-noexport">​</span></span></span>두마리가 나오<br>
집에 새끼 생각이 나는 모양이오.
</p>
