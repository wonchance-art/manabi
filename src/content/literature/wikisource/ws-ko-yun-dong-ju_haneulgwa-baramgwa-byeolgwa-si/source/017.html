<span><span class="pagenum ws-pagenum" id="36" data-page-number="36" data-page-name="페이지:윤동주 하늘과 바람과 별과 시 (초판본, 1948).pdf/36" data-page-index="36" data-page-quality="1" title="%ED%8E%98%EC%9D%B4%EC%A7%80:%EC%9C%A4%EB%8F%99%EC%A3%BC_%ED%95%98%EB%8A%98%EA%B3%BC_%EB%B0%94%EB%9E%8C%EA%B3%BC_%EB%B3%84%EA%B3%BC_%EC%8B%9C_(%EC%B4%88%ED%8C%90%EB%B3%B8,_1948).pdf/36"><span id="pageindex_36" class="pagenum-inner ws-noexport">​</span></span></span><div class="tiInherit" style="text-align:center;">
<p><span style="font-size:120%;">또 다른 故鄕</span>
</p>
</div>
<div class="poem">
<p>故鄕에 돌아온날 밤에<br>
내 白骨이 따라와 한방에 누웠다.<br>
<br>
어둔 房은 宇宙로 通하고<br>
하늘에선가 소리처럼 바람이 불어온다.<br>
<br>
어둠속에 곱게 風化作用하는<br>
白骨을 들여다 보며<br>
눈물 짓는것이 내가 우는것이냐<br>
白骨이 우는것이냐<br>
아름다운 魂이 우는것이냐<br>
<br>
志操 높은 개는<br>
밤을 새워 어둠을 짖는다.
</p>
</div> <span><span class="pagenum ws-pagenum" id="37" data-page-number="37" data-page-name="페이지:윤동주 하늘과 바람과 별과 시 (초판본, 1948).pdf/37" data-page-index="37" data-page-quality="1" title="%ED%8E%98%EC%9D%B4%EC%A7%80:%EC%9C%A4%EB%8F%99%EC%A3%BC_%ED%95%98%EB%8A%98%EA%B3%BC_%EB%B0%94%EB%9E%8C%EA%B3%BC_%EB%B3%84%EA%B3%BC_%EC%8B%9C_(%EC%B4%88%ED%8C%90%EB%B3%B8,_1948).pdf/37"><span id="pageindex_37" class="pagenum-inner ws-noexport">​</span></span></span><div class="poem">
<p>어둠을 짖는 개는<br>
나를 쫓는 것일게다.<br>
<br>
가자 가자<br>
쫓기우는 사람처럼 가자<br>
白骨몰래<br>
아름다운 또 다른 故鄕에 가자.
</p>
</div>
