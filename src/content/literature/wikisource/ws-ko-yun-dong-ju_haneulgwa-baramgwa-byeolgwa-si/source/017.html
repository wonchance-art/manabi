<p><span style="font-size:144%;">또 다른 故鄕</span>
</p>
</div>
<div style="visibility:hidden; line-height:100%;">&nbsp;</div>
<div style="float:left; width:auto; text-align:inherit;">
<p>故鄕에 돌아온 날 밤에<br>
내 白骨이 따라와 한방에 누었다.<br><br>
어둔 房은 宇宙로 通하고<br>
하늘에선가 소리처럼 바람이 불어온다.<br><br>
어둠 속에서 곱게 風化作用하는<br>
白骨을 드려다 보며<br>
눈물 짓는 것이 내가 우는 것이냐<br> <span><span class="pagenum ws-pagenum" id="35" data-page-number="35" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/38" data-page-index="38" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/38"><span id="pageindex_38" class="pagenum-inner ws-noexport">​</span></span></span>白骨이 우는 것이냐<br>
아름다운 魂이 우는 것이냐<br><br>
志操 높은 개는<br>
밤을 새워 어둠을 짖는다.<br><br>
어둠을 짖는 개는<br>
나를 쫓는 것일게다.<br><br>
가자 가자<br>
쫓기우는 사람처럼 가자<br>
白骨 몰래<br>
아름다운 또 다른 故鄕에 가자.
</p>
