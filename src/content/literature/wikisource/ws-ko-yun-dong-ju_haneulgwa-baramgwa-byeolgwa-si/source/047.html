<p>이른 아침 아낙네들은 시들은 生活을<br>
바구니 하나 가득 담아 이고……<br>
업고 지고…… 안고 들고……<br>
모여드오 자꾸 장에 모여드오.<br><br>
가난한 生活을 골골이 버려놓고<br>
밀려가고 밀려오고……<br>
제마다 生活을 외치오…… 싸우오.<br><br>
왼하로 올망졸망한 生活을<br>
되질하고 저울질하고 자질하다가<br>
날이 저물어 아낙네들이<br>
쓴 生活과 바꾸어 또 이고 돌아가오.
</p>
