<p><span style="font-size:144%;">異蹟</span>
</p>
</div>
<div style="visibility:hidden; line-height:100%;">&nbsp;</div>
<div style="float:left; width:auto; text-align:inherit;">
<p>발에 터부한 것을 다 빼어 바리고<br>
黃昏이 湖水우로 걸어 오듯이<br>
나도 삽분삽분 걸어 보리이까?<br><br>
내사 이 湖水가로<br>
부르는 이 없이<br>
불리워 온것은<br>
참말 異蹟이외다.<br><br> <span><span class="pagenum ws-pagenum" id="71" data-page-number="71" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/74" data-page-index="74" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/74"><span id="pageindex_74" class="pagenum-inner ws-noexport">​</span></span></span>오늘 따라<br>
戀情, 自惚, 猜忌, 이것들이<br>
자꼬 金메달처럼 만져지는구려<br><br>
하나, 내 모든 것을 餘念없이<br>
물결에 씻어 보내려니<br>
당신은 湖面으로 나를 불러 내소서.
</p>
