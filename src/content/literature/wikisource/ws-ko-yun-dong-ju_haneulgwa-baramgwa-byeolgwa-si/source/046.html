<p><span style="font-size:144%;">달밤</span>
</p>
</div><br>
<p>흐르는 달의 흰 물결을 밀쳐<br>
여윈 나무그림자를 밟으며<br>
北邙山을 向한 발걸음은 무거웁고<br>
孤獨을 伴侶한 마음은 슬프기도 하다.<br><br>
누가 있어만 싶은 墓地엔 아무도 없고,<br>
靜寂만이 군데군데 흰물결에 폭 젖었다.
</p>
