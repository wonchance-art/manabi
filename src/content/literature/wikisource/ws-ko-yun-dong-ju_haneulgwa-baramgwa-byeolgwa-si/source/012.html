<div class="poem">
<p>거 나를 부르는 것이 누구요.<br>
<br>
가랑잎 이파리 푸르러 나오는 그늘인데,<br>
나 아직 여기 呼吸이 남어 있소.<br>
<br>
한번도 손들어 보지못한 나를<br>
손들어 표할 하늘도 없는 나를<br>
<br>
어디에 내 한몸둘 하늘이 있어<br>
나를 부르는 것이오.<br>
<br>
일이 마치고 내 죽는 날 아츰에는<br>
서럽지도 않은 가랑잎이 떨어질텐데……<br>
<br>
나를 부르지마오.
</p>
