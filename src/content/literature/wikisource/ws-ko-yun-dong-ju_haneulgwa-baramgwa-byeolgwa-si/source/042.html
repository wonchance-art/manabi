<div style="float:left; width:auto; text-align:inherit;">
<p>가츨가츨한 머리칼은 오막사리 처마끝,<br>
쉬파람에 콧마루가 서운한양 간질키오.<br><br>
들窓같은 눈은 가볍게 닫혀<br>
이밤에 戀情은 어둠처럼 골골히 스며드오.
</p>
