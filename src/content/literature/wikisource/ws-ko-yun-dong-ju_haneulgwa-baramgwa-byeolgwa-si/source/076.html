<p><span style="font-size:144%;">참새</span>
</p>
</div><br>
<p>가을지난 마당은 하이얀종이<br>
참새들이 글씨를 공부하지요.<br><br>
째액째액 입으로 받아읽으며<br>
두발로는 글씨를 연습하지요.<br><br>
하로종일 글씨를 공부하여도<br>
짹자한자 밖에는 더못쓰는걸.
</p>
