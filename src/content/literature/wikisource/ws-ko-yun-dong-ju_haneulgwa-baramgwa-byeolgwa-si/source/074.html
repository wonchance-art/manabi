<p><span style="font-size:144%;">거짓부리</span>
</p>
</div><br>
<p>똑, 똑, 똑,<br>
문좀 열어 주세요<br>
하루밤 자고 갑시다.<br>
<span style="display:inline-block; inline-size:2em"></span>밤은 깊고 날은 추운데<br>
<span style="display:inline-block; inline-size:2em"></span>거 누굴까?<br>
문열어 주고 보니<br>
검둥이의 꼬리가<br>
거짓부리한걸.<br><br> <span><span class="pagenum ws-pagenum" id="141" data-page-number="141" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/144" data-page-index="144" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/144"><span id="pageindex_144" class="pagenum-inner ws-noexport">​</span></span></span>꼬기요, 꼬기요,<br>
달걀 낳았다.<br>
간난아 어서 집어 가거라<br>
<span style="display:inline-block; inline-size:2em"></span>간난이 뛰어가 보니<br>
<span style="display:inline-block; inline-size:2em"></span>달걀은 무슨 달걀,<br>
고놈의 암탉이<br>
대낮에 새빨간<br>
</p>
거짓부리 한걸.</div>
