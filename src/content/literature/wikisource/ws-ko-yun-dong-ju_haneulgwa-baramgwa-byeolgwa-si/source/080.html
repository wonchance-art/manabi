<p><span style="font-size:144%;">무얼 먹구 사나</span>
</p>
</div><br>
<p>바닷가 사람<br>
물고기 잡아 먹고 살고<br><br>
산골엣 사람<br>
감자 구어 먹고 살고<br><br>
별나라 사람<br>
무얼 먹고 사나.
</p>
<div style="text-align:right; padding-top: 0em; margin-right:0;">
<p><span style="font-size:92%;">一九三六•一〇</span>
