<p><span style="font-size:144%;">고추 밭</span>
</p>
</div>
<div style="visibility:hidden; line-height:100%;">&nbsp;</div>
<div style="float:left; width:auto; text-align:inherit;">
<p>시들은 잎새속에서<br>
고 빠알간 살을 드러 내 놓고,<br>
고추는 芳年된 아가씬양<br>
땡볕에 자꼬 익어간다.<br><br>
할머니는 바구니를 들고<br>
밭머리에서 어정거리고<br>
손가락 너어는 아이는<br>
할머니 뒤만 따른다.
</p>
