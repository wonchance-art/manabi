<span><span class="pagenum ws-pagenum" id="62" data-page-number="62" data-page-name="페이지:윤동주 하늘과 바람과 별과 시 (초판본, 1948).pdf/62" data-page-index="62" data-page-quality="1" title="%ED%8E%98%EC%9D%B4%EC%A7%80:%EC%9C%A4%EB%8F%99%EC%A3%BC_%ED%95%98%EB%8A%98%EA%B3%BC_%EB%B0%94%EB%9E%8C%EA%B3%BC_%EB%B3%84%EA%B3%BC_%EC%8B%9C_(%EC%B4%88%ED%8C%90%EB%B3%B8,_1948).pdf/62"><span id="pageindex_62" class="pagenum-inner ws-noexport">​</span></span></span><div class="tiInherit" style="text-align:center;">
<p><span style="font-size:120%;">懺悔錄</span>
</p>
</div>
<div class="poem">
<p>파란 녹이 낀 구리거울 속에<br>
내 얼골이 남어있는것은<br>
어느 王朝의 遺物이기에<br>
이다지도 욕될가<br>
<br>
나는 나의 참회의 글을 한줄에 줄이자<br>
——滿二十四年 一個月을<br>
<span class="mw-poem-indented" style="display: inline-block; margin-inline-start: 2em;">무슨 기쁨을 바라 살아왔는가</span><br>
<br>
내일이나 모레나 그 어느 즐거운 날에<br>
나는 또 한줄의 참회록을 써야한다.<br>
——그때 그 젊은 나이에<br>
<span class="mw-poem-indented" style="display: inline-block; margin-inline-start: 2em;">웨 그런 부끄런 告白을 했든가</span>
</p>
</div>
<div class="__nop wst-nop"></div>
 <span><span class="pagenum ws-pagenum" id="63" data-page-number="63" data-page-name="페이지:윤동주 하늘과 바람과 별과 시 (초판본, 1948).pdf/63" data-page-index="63" data-page-quality="1" title="%ED%8E%98%EC%9D%B4%EC%A7%80:%EC%9C%A4%EB%8F%99%EC%A3%BC_%ED%95%98%EB%8A%98%EA%B3%BC_%EB%B0%94%EB%9E%8C%EA%B3%BC_%EB%B3%84%EA%B3%BC_%EC%8B%9C_(%EC%B4%88%ED%8C%90%EB%B3%B8,_1948).pdf/63"><span id="pageindex_63" class="pagenum-inner ws-noexport">​</span></span></span><div class="poem">
<p>밤이면 밤마다 나의 거울을<br>
손바닥으로 발바닥으로 닦어보자<br>
<br>
그러면 어느 隕石밑으로 흘로 걸어가는<br>
슬픈 사람의 뒷모양이<br>
거울 속에 나타나 온다.
</p>
