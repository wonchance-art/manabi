<p><span style="font-size:144%;">삶과 죽음</span>
</p>
</div><br>
<p>삶은 오늘도 죽음의 序曲을 노래하였다.<br>
이 노래가 언제나 끝나랴<br><br>
세상사람은<span style="text-decoration:line-through;"><span style="color:transparent !important;">——</span></span><br>
뼈를 녹여내는듯한 삶의 노래에<br>
춤을 춘다.<br>
사람들은 해가 넘어가기전<br>
이 노래 끝의 恐怖를<br>
생각할 사이가 없었다.<br><br> <span><span class="pagenum ws-pagenum" id="123" data-page-number="123" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/126" data-page-index="126" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/126"><span id="pageindex_126" class="pagenum-inner ws-noexport">​</span></span></span>하늘 복판에 알새기 듯이<br>
이 노래를 부른者가 누구뇨<br><br>
그리고 소낙비 그친뒤같이도<br>
이 노래를 그친者가 누구뇨<br><br>
죽고 뼈만 남은<br>
죽음의 勝利者 偉人들!
</p>
