<p>번개, 뇌성, 왁자지근 뚜다려<br>
머—ㄴ 都會地에 落雷가 있어만 싶다.<br><br>
벼루짱 엎어논 하늘로<br>
살같은 비가 살처럼 쏟아진다.<br><br>
손바닥만한 나의 庭園이<br>
마음같이 흐린 湖水되기 일수다.<br><br> <span><span class="pagenum ws-pagenum" id="87" data-page-number="87" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/90" data-page-index="90" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/90"><span id="pageindex_90" class="pagenum-inner ws-noexport">​</span></span></span>바람이 팽이처럼 돈다.<br>
