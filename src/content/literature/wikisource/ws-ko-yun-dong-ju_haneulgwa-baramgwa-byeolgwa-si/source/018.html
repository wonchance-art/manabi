<span><span class="pagenum ws-pagenum" id="38" data-page-number="38" data-page-name="페이지:윤동주 하늘과 바람과 별과 시 (초판본, 1948).pdf/38" data-page-index="38" data-page-quality="1" title="%ED%8E%98%EC%9D%B4%EC%A7%80:%EC%9C%A4%EB%8F%99%EC%A3%BC_%ED%95%98%EB%8A%98%EA%B3%BC_%EB%B0%94%EB%9E%8C%EA%B3%BC_%EB%B3%84%EA%B3%BC_%EC%8B%9C_(%EC%B4%88%ED%8C%90%EB%B3%B8,_1948).pdf/38"><span id="pageindex_38" class="pagenum-inner ws-noexport">​</span></span></span><div class="tiInherit" style="text-align:center;">
<p><span style="font-size:120%;">길</span>
</p>
</div>
<div class="poem">
<p>잃어 버렸읍니다.<br>
무얼 어디다 잃었는지 몰라<br>
두손이 호주머니를 더듬어<br>
길에 나아갑니다.<br>
<br>
돌과 돌과 돌이 끝없이 연달어<br>
길은 돌담을 끼고 갑니다.<br>
<br>
담은 쇠문을 굳게 닫어<br>
길우에 긴 그림자를 드리우고<br>
<br>
길은 아츰에서 저녁으로<br>
저녁에서 아츰으로 통했습니다.
</p>
</div>
<div class="__nop wst-nop"></div>
 <span><span class="pagenum ws-pagenum" id="39" data-page-number="39" data-page-name="페이지:윤동주 하늘과 바람과 별과 시 (초판본, 1948).pdf/39" data-page-index="39" data-page-quality="1" title="%ED%8E%98%EC%9D%B4%EC%A7%80:%EC%9C%A4%EB%8F%99%EC%A3%BC_%ED%95%98%EB%8A%98%EA%B3%BC_%EB%B0%94%EB%9E%8C%EA%B3%BC_%EB%B3%84%EA%B3%BC_%EC%8B%9C_(%EC%B4%88%ED%8C%90%EB%B3%B8,_1948).pdf/39"><span id="pageindex_39" class="pagenum-inner ws-noexport">​</span></span></span><div class="poem">
<p>돌담을 더듬어 눈물 짓다<br>
쳐다보면 하늘은 부끄럽게 푸릅니다.<br>
<br>
풀 한포기 없는 이 길을 걷는것은<br>
담 저쪽에 내가 남어 있는 까닭이고,<br>
<br>
내가 사는것은 다만,<br>
잃은것을 찾는 까닭입니다.
</p>
</div>
