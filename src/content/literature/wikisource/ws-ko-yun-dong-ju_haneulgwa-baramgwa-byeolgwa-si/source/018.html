<div style="float:left; width:auto; text-align:inherit;">
<p>잃어 버렸읍니다.<br>
무얼 어디다 잃었는지 몰라<br>
두 손이 주머니를 더듬어<br>
길에 나아갑니다.<br><br>
돌과 돌과 돌이 끝없이 연달어<br>
길은 돌담을 끼고 갑니다.<br><br>
담은 쇠문을 굳게 닫어<br> <span><span class="pagenum ws-pagenum" id="37" data-page-number="37" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/40" data-page-index="40" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/40"><span id="pageindex_40" class="pagenum-inner ws-noexport">​</span></span></span>길 우에 긴 그림자를 드리우고<br><br>
길은 아침에서 저녁으로<br>
저녁에서 아침으로 통했읍니다.<br><br>
돌담을 더듬어 눈물 짓다<br>
쳐다보면 하늘은 부끄럽게 푸릅니다.<br><br>
풀 한포기 없는 이 길을 걷는 것은<br>
담 저쪽에 내가 남어 있는 까닭이고,<br><br>
내가 사는 것은, 다만,<br>
잃은 것을 찾는 까닭입니다.
</p>
