<p><span style="font-size:120%;">눈감고 간다</span>
</p>
</div>
<div class="poem">
<p>太陽을 사모하는 아이들아<br>
별을 사랑하는 아이들아<br>
&nbsp;<br>
밤이 어두었는데<br>
눈감고 가거라.<br>
&nbsp;<br>
가진바 씨앗을<br>
뿌리면서 가거라.<br>
&nbsp;<br>
발뿌리에 돌이 채이거든<br>
감었든 눈을 와짝떠라.
</p>
