<div style="float:left; width:auto; text-align:inherit;">
<p>太陽을 사모하는 아이들아<br>
별을 사랑하는 아이들아<br>
밤이 어두었는데<br>
눈 감고 가거라.<br><br>
가진바 씨앗을<br>
뿌리면서 가거라.<br>
발뿌리에 돌이 채이거든<br>
감었든 눈을 와짝 떠라.
</p>
