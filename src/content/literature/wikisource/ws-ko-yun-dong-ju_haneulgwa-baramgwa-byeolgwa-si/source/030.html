<p><span style="font-size:120%;">산골물</span>
</p>
</div>
<div class="poem">
<p>괴로운 사람아 괴로운 사람아<br>
옷자락 물결속에서도<br>
가슴속 깊이 돌돌 샘물이 홀러<br>
이 밤을 더부러 말할이 없도다.<br>
거리의 소음과 노래 부를수 없도다.<br>
그신듯이 냇가에 앉었으니<br>
사랑과 일을 거리에 맥기고<br>
가마니 가마니<br>
바다로 가자,<br>
바다로 가자.
</p>
