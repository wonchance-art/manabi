<p><span style="font-size:144%;">아우의 印像畵</span>
</p>
</div>
<div style="visibility:hidden; line-height:100%;">&nbsp;</div>
<div style="float:left; width:auto; text-align:inherit;">
<p>붉은 이마에 싸늘한 달이 서리어<br>
아우의 얼굴은 슬픈 그림이다.<br><br>
발걸음을 멈추어<br>
살그머니 애딘 손을 잡으며<br>
「늬는 자라 무엇이 되려니」<br>
「사람이 되지」<br>
아우의 설은 진정코 설은 對答이다.<br><br> <span><span class="pagenum ws-pagenum" id="67" data-page-number="67" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/70" data-page-index="70" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/70"><span id="pageindex_70" class="pagenum-inner ws-noexport">​</span></span></span>슬며시 잡았든 손을 놓고<br>
아우의 얼골을 다시 들여다 본다.<br><br>
싸늘한 달이 붉은 이마에 젖어<br>
아우의 얼골은 슬픈 그림이다.
</p>
