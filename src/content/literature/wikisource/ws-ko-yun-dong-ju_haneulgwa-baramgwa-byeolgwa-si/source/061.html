<p>햇살은 미닫이 틈으로<br>
길죽한 一字를 쓰고…… 지우고……<br><br>
까마귀떼 지붕 우으로<br>
둘, 둘, 셋, 넷, 자꼬 날아 지난다.<br>
쑥쑥, 꿈틀꿈틀 北쪽 하늘로,<br><br>
내사………<br>
北쪽 하늘에 나래를 펴고 싶다.
</p>
