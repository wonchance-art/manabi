<span><span class="pagenum ws-pagenum" id="154" data-page-number="154" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/157" data-page-index="157" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/157"><span id="pageindex_157" class="pagenum-inner ws-noexport">​</span></span></span><div style="float:left; width:auto; text-align:inherit;"><div class="tiInherit" style="text-align:center;">
<p><span style="font-size:144%;">빗자루</span>
</p>
</div><br>
<p>요오리 조리 베면 저고리 되고<br>
이이렇게 베면 큰 총되지.<br>
<span style="display:inline-block; inline-size:2em"></span>누나하고 나하고<br>
<span style="display:inline-block; inline-size:2em"></span>가위로 종이 쏠았더니<br>
<span style="display:inline-block; inline-size:2em"></span>어머니가 빗자루 들고<br>
<span style="display:inline-block; inline-size:2em"></span>누나하나 나하나<br>
<span style="display:inline-block; inline-size:2em"></span>엉덩이를 때렸소<br>
<span style="display:inline-block; inline-size:2em"></span>방바닥이 어지럽다고<span style="text-decoration:line-through;"><span style="color:transparent !important;">——</span></span><br> <span><span class="pagenum ws-pagenum" id="155" data-page-number="155" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/158" data-page-index="158" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/158"><span id="pageindex_158" class="pagenum-inner ws-noexport">​</span></span></span><span style="display:inline-block; inline-size:2em"></span>아아니 아니<br>
<span style="display:inline-block; inline-size:2em"></span>고놈의 빗자루가<br>
<span style="display:inline-block; inline-size:2em"></span>방바닥 쓸기 싫으니<br>
<span style="display:inline-block; inline-size:2em"></span>그랬지 그랬어<br>
괘씸하여 벽장속에 감췄드니<br>
이튼날 아침 빗자루가 없다고<br>
어머니가 야단이지요.
</p>
