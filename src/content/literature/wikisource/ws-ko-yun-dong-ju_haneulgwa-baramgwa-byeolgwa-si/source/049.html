<p>하로도 검푸른 물결에<br>
흐느적 잠기고…… 잠기고……<br><br>
저— 왼 검은 고기떼가<br>
물든 바다를 날아 橫斷할고.<br><br>
落葉이 된 海草<br>
海草마다 슬프기도 하오.<br><br> <span><span class="pagenum ws-pagenum" id="97" data-page-number="97" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/100" data-page-index="100" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/100"><span id="pageindex_100" class="pagenum-inner ws-noexport">​</span></span></span>西窓에 걸린 해말간 風景畵.<br>
옷고름 너어는 孤兒의 서름.<br><br>
이제 첫 航海하는 마음을 먹고<br>
방바닥에 나딩구오…… 딩구오……<br><br>
黃昏이 바다가 되어<br>
오늘도 數많은 배가<br>
나와 함께 이 물결에 잠겼을게오.
</p>
