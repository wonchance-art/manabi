<p><span style="font-size:120%;">슬픈 族屬</span>
</p>
</div>
<div class="poem">
<p>흰 수건이 검은 머리를 두르고<br>
흰 고무신이 거츤발에 걸리우다.<br>
<br>
흰 저고리 치마가 슬픈 몸집을 가리고<br>
흰 띄가 가는 허리를 질끈 동이다.
</p>
