<p>사이좋은 正門의 두 돌기둥 끝에서<br>
五色旗와 太陽旗가 춤을 추는 날,<br>
금을 그은 地域의 아이들이 즐거워 하다.<br><br>
아이들에게 하로의 乾燥한 學課로<br>
해말간 倦怠가 깃들고<br>
「矛盾」 두자를 理解치 못하도록<br>
머리가 單純하였구나.<br><br> <span><span class="pagenum ws-pagenum" id="105" data-page-number="105" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/108" data-page-index="108" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/108"><span id="pageindex_108" class="pagenum-inner ws-noexport">​</span></span></span>이런 날에는<br>
잃어 버린 頑固하던 兄을<br>
부르고 싶다.
</p>
