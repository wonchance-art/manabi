<div class="poem">
<p>봄이 血管속에 시내처럼 흘러<br>
돌, 돌, 시내 가차운 언덕에<br>
개나리, 진달래, 노오란 배추꽃,<br>
<br>
三冬을 참어온 나는<br>
풀포기처럼 피어난다.<br>
<br>
즐거운 종달새야<br>
어느 이랑에서나 즐거웁게 솟쳐라.<br>
<br>
푸르른 하늘은<br>
아른아른 높기도 한데……
</p>
