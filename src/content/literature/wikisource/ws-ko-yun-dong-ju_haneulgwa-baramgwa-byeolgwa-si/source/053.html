<p><span style="font-size:144%;">山林</span>
</p>
</div><br>
<p>時計가 자근자근 가슴을 따려<br>
不安한 마음을 山林이 부른다.<br><br>
千年 오래인 年輪에 짜들은 幽暗한 山林이,<br>
고달픈 한몸을 抱擁할 因緣을 가졌나보다.<br><br>
山林의 검은 波動우으로부터<br>
어둠은 어린 가슴을 짓밟고<br><br> <span><span class="pagenum ws-pagenum" id="103" data-page-number="103" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/106" data-page-index="106" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/106"><span id="pageindex_106" class="pagenum-inner ws-noexport">​</span></span></span>이파리를 흔드는 저녁바람이<br>
솨— 恐怖에 떨게한다.<br><br>
멀리 첫여름의 개고리 재질댐에<br>
흘러간 마을의 過去는 아질타.<br><br>
나무틈으로 반짝이는 별만이<br>
새날의 希望으로 나를 이끈다.
</p>
