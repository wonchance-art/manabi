<p>솨— 철석! 파도소리 문살에 부서져<br>
잠 살포시 꿈이 흐터진다.<br><br>
잠은 한낱 검은 고래떼처럼 살래어,<br>
달랠 아무런 재주도 없다.<br><br>
불을 밝혀 잠옷을 정성스리 여미는<br>
三更.<br>
