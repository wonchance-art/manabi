<p>지난밤에<br>
눈이 소오복이 왔네<br><br>
지붕이랑<br>
길이랑 밭이랑<br>
추워 한다고<br>
덮어주는 이불인가바<br><br>
그러기에<br>
추운 겨을에만 나리지
</p>
