<p><span style="font-size:120%;">또 太初의 아츰</span>
</p>
</div>
<div class="poem">
<p>하얗게 눈이 덮이었고<br>
電信柱가 잉잉 울어<br>
하나님 말씀이 들려온다.<br>
<br>
무슨 啓示일까.<br>
<br>
빨리<br>
봄이 오면<br>
罪를 짓고<br>
눈이 밝어<br>
<br>
이브가 解産하는 수고를 다하면<br>
<br>
無花果 잎사귀로 부끄런데를 가리고<br>
<br>
나는 이마에 땀을 흘려야겠다.
</p>
