<p>잠은 눈을 떴다<br>
그윽한 幽霧에서.<br><br>
노래 하든 종달이<br>
도망쳐 날아나고,<br><br>
지난날 봄타령하든<br>
금잔디밭은 아니다.<br><br>
塔은 무너졌다,<br> <span><span class="pagenum ws-pagenum" id="101" data-page-number="101" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/104" data-page-index="104" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/104"><span id="pageindex_104" class="pagenum-inner ws-noexport">​</span></span></span>붉은 마음의 塔이<span style="text-decoration:line-through;"><span style="color:transparent !important;">——</span></span><br><br>
손톱으로 새긴 大理石塔이<span style="text-decoration:line-through;"><span style="color:transparent !important;">——</span></span><br>
하로저녁 暴風에 餘地없이도,<br><br>
오오 荒廢의 쑥밭,<br>
눈물과 목메임이여!<br><br>
꿈은 깨어졌다<br>
탑은 무너졌다.
</p>
