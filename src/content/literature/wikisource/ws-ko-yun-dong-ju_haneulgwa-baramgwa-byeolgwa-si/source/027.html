<p><span style="font-size:120%;">아우의 印像畵</span>
</p>
</div>
<div class="poem">
<p>붉은 이마에 싸늘한 달이 서리어<br>
아우의 얼굴은 슬픈 그림이다.<br>
<br>
발거리 멈추어<br>
살그머니 애딘 손을 잡으며<br>
“늬는 자라 무엇이 되려니”<br>
“사람이 되지”<br>
아우의 설흔 진정코 설흔 對答이다.<br>
<br>
슬며—시 잡었든 손을 놓고<br>
아우의 얼골을 다시 들여다 본다.<br>
<br>
싸늘한 달이 붉은 이마에 젖어<br>
아우의 얼골은 슬픈 그림이다.
</p>
</div>
