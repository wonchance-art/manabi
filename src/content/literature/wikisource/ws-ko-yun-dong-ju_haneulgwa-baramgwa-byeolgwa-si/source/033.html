<p><span style="font-size:144%;">사랑의 殿堂</span>
</p>
</div>
<div style="visibility:hidden; line-height:100%;">&nbsp;</div>
<div style="float:left; width:auto; text-align:inherit;">
<p>順아 너는 내 殿에 언제 들어왔든 것이냐?<br>
내사 언제 네 殿에 들어갔든 것이냐?<br><br>
우리들의 殿堂은<br>
古風한 風習이 어린 사랑의 殿堂<br><br>
順아 암사슴처럼 水晶눈을 나려감어라.<br>
난 사자처럼 엉크린 머리를 고루련다.<br><br> <span><span class="pagenum ws-pagenum" id="69" data-page-number="69" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/72" data-page-index="72" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/72"><span id="pageindex_72" class="pagenum-inner ws-noexport">​</span></span></span>우리들의 사랑은 한낱 벙어리었다.<br><br>
聖스런 촛대에 熱한 불이 꺼지기 前<br>
順아 너는 앞문으로 내 달려라.<br><br>
어둠과 바람이 우리窓에 부닥치기 前<br>
나는 永遠한 사랑을 안은채<br>
뒷문으로 멀리 사라지련다.<br><br>
이제 네게는 森林속의 아늑한 湖水가 있고<br>
내게는 峻嶮한 山脈이 있다.
</p>
