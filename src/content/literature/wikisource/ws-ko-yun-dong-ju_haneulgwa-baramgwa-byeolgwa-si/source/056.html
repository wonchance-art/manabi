<p>저쪽으로 黃土 실은 이땅 봄바람이<br>
胡人의 물레바퀴처럼 돌아 지나고<br><br>
아롱진 四月太陽의 손길이<br>
壁을 등진 섫은 가슴마다 올올히 만진다.<br><br>
地圖째기 놀음에 뉘 땅인줄 모르는 애 둘이<br>
한 뼘 손가락이 짧음을 恨함이어<br><br> <span><span class="pagenum ws-pagenum" id="109" data-page-number="109" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/112" data-page-index="112" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/112"><span id="pageindex_112" class="pagenum-inner ws-noexport">​</span></span></span>아서라! 가뜩이나 엷은 平和가<br>
깨어질까 근심스럽다.
</p>
