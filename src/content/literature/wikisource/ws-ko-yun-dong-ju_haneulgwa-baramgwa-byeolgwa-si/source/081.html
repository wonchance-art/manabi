<p><span style="font-size:144%;">굴뚝</span>
</p>
</div><br>
<p>산골작이 오막사리 낮은 굴뚝엔<br>
몽기몽기 웨인연기 대낮에 솟나,<br><br>
감자를 굽는게지 총각애들이<br>
깜박깜박 검은눈이 모여 앉어서<br>
입술에 꺼멓게 숯을 바르고<br>
옛이야기 한커리에 감자 하나씩.<br><br>
산골작이 오막사리 낮은 굴뚝엔<br>
살랑살랑 솟아나네 감자 굽는내.
</p>
<div style="text-align:right; padding-top: 0em; margin-right:0;">
<p><span style="font-size:92%;">一九三六•가을</span>
