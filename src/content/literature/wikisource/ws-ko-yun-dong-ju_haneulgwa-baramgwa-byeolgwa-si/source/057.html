<p>한間 鷄舍 그넘어 蒼空이 깃들어<br>
自由의 鄕土를 잊은 닭들이<br>
시들은 生活을 주잘대고<br>
生産의 苦勞를 부르짖었다.<br><br>
陰酸한 鷄舍에서 쏠려나온<br>
外來種 레구홍,<br>
學園에서 새무리가 밀려나오는<br>
三月의 맑은 午後도 있다.<br><br> <span><span class="pagenum ws-pagenum" id="111" data-page-number="111" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/114" data-page-index="114" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/114"><span id="pageindex_114" class="pagenum-inner ws-noexport">​</span></span></span>닭들은 녹아드는 두엄을 파기에<br>
雅淡한 두 다리가 奔走하고<br>
굶주렸던 주두리가 바즈런하다.<br>
두눈이 붉게 여므도록<span style="text-decoration:line-through;"><span style="color:transparent !important;">——</span></span>
</p>
