<p><span style="font-size:144%;">오줌싸개지도</span>

</div><br>
<p>빨래줄에 걸어논<br>
<span style="display:inline-block; inline-size:2em"></span>요에다 그린지도<br>
지난밤에 내동생<br>
<span style="display:inline-block; inline-size:2em"></span>오줌싸 그린지도<br><br>
꿈에 가본 엄마계신<br>
<span style="display:inline-block; inline-size:2em"></span>별나라 지돈가?<br>
돈벌러간 아빠계신<br>
<span style="display:inline-block; inline-size:2em"></span>만주땅 지돈가?
</p>
