<p><span style="font-size:144%;">기왓장 내외</span>
</p>
</div><br>
<p>비오는날 저녁에 기왓장내외<br>
잃어버린 외아들 생각나선지<br>
꼬부라진 잔등을 어루만지며<br>
쭈룩쭈룩 구슬피 울음웁니다.<br><br>
대궐지붕 위에서 기왓장내외<br>
아름답든 옛날이 그리워선지<br>
주름잡힌 얼굴을 어루만지며<br>
</p>
물끄럼히 하늘만 쳐다봅니다.</div>
