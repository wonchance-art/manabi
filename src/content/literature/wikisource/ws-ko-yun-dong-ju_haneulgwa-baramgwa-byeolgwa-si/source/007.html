<p><span style="font-size:120%;">새로운 길</span>
</p>
</div>
<div class="poem">
<p>내를 건너서 숲으로 <br>
고개를 넘어서 마을로 <br>
<br>
어제도 가고 오늘도 갈 <br>
나의 길 새로운 길 <br>
<br>
문들레가 피고 까치가 날고 <br>
아가씨가 지나고 바람이 일고 <br>
<br>
나의 길은 언제나 새로운 길 <br>
오늘도…… 내일도…… <br>
<br>
내를 건너서 숲으로 <br>
고개를 넘어서 마을로
</p>
