<p><span style="font-size:120%;">太初의 아츰</span>
</p>
</div>
<div class="poem">
<p>봄날 아츰도 아니고<br>
여름, 가을, 겨울,<br>
그런날 아츰도 아닌 아츰에<br>
<br>
빨—간 꽃이 피어났네,<br>
햇빛이 푸른데,<br>
<br>
그 前날 밤에<br>
그 前날 밤에<br>
모든것이 마련되었네,<br>
<br>
사랑은 뱀과 함께<br>
毒은 어린 꽃과 함께
</p>
