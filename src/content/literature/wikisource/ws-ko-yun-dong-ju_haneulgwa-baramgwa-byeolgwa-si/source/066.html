<p>초 한대<span style="text-decoration:line-through;"><span style="color:transparent !important;">——</span></span><br>
내방에 품긴 향내를 맡는다.<br><br>
光明의 祭壇이 무너지기전<br>
나는 깨끗한 祭物을 보았다.<br><br>
염소의 갈비뼈같은 그의 몸,<br>
그의 生命인 心志까지<br>
白玉같은 눈물과 피를 흘려<br>
불살려 버린다.<br><br> <span><span class="pagenum ws-pagenum" id="125" data-page-number="125" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/128" data-page-index="128" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/128"><span id="pageindex_128" class="pagenum-inner ws-noexport">​</span></span></span>그리고도 책상머리에 아롱거리며<br>
선녀처럼 촛불은 춤을 춘다.<br><br>
매를 본 꿩이 도망하듯이<br>
暗黑이 창구멍으로 도망한<br>
나의 방에 품긴<br>
祭物의 偉大한 香내를 맛보노라.
</p>
