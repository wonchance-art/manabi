<p>달밤의 거리<br>
狂風이 휘날리는<br>
北國의 거리<br>
都市의 眞珠<br>
電燈밑을 헤염치는<br>
조그만 人魚 나,<br>
달과 전등에 비쳐<br>
한몸에 둘셋의 그림자,<br>
커졌다 작아졌다.<br> <span><span class="pagenum ws-pagenum" id="121" data-page-number="121" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/124" data-page-index="124" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/124"><span id="pageindex_124" class="pagenum-inner ws-noexport">​</span></span></span>괴롬의 거리<br>
灰色빛 밤거리를<br>
걷고 있는 이 마음<br>
旋風이 일고 있네<br>
외로우면서도<br>
한갈피 두갈피<br>
피어나는 마음의 그림자,<br>
푸른 空想이<br>
높아졌다 낮아졌다.
</p>
