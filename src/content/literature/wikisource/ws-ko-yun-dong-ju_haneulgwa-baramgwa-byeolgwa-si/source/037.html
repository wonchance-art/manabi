<p>후어—ㄴ한 房에<br>
遺言은 소리 없는 입놀림.<br><br>
<span style="display:inline-block; inline-size:2em"></span>바다에 眞珠캐려 갔다는 아들<br>
<span style="display:inline-block; inline-size:2em"></span>海女와 사랑을 속사긴다는 맏아들<br>
<span style="display:inline-block; inline-size:2em"></span>이밤에사 돌아 오나 내다 봐라<span style="text-decoration:line-through;"><span style="color:transparent !important;">——</span></span><br><br>
平生 외롭든 아버지의 殞命<br>
감기우는 눈에 슬픔이 어린다.<br><br> <span><span class="pagenum ws-pagenum" id="77" data-page-number="77" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/80" data-page-index="80" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/80"><span id="pageindex_80" class="pagenum-inner ws-noexport">​</span></span></span>외딴집에 개가 짖고<br>

</p>
