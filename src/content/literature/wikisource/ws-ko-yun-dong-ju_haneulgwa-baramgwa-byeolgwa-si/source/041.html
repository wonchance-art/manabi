<p><span style="font-size:144%;">山峽의 午後</span>
</p>
</div>
<div style="visibility:hidden; line-height:100%;">&nbsp;</div>
<div style="float:left; width:auto; text-align:inherit;">
<p>내 노래는 오히려<br>
섫은 산울림.<br><br>
골자기 길에<br>
떨어진 그림자는<br>
너무나 슬프구나<br><br>
午後의 瞑想은<br>
아— 졸려.
</p>
