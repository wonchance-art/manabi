<p>쉬는 時間마다<br>
나는 窓옄으로 갑니다.<br><br>
<span style="text-decoration:line-through;"><span style="color:transparent !important;">——</span></span>窓은 산 가르침.<br><br>
이글이글 불을 피워주소,<br>
이방에 찬것이 서립니다.<br><br>
단풍잎 하나<br> <span><span class="pagenum ws-pagenum" id="79" data-page-number="79" data-page-name="페이지:Sky, Wind, Star and Poem (1955).djvu/82" data-page-index="82" data-page-quality="3" title="%ED%8E%98%EC%9D%B4%EC%A7%80:Sky,_Wind,_Star_and_Poem_(1955).djvu/82"><span id="pageindex_82" class="pagenum-inner ws-noexport">​</span></span></span>맴 도나 보니<br>
아마도 작으마한 旋風이 인게웨다.<br><br>
그래도 싸느란 유리창에<br>
햇살이 쨍쨍한 무렵,<br>
上學鐘이 울어만 싶습니다.
</p>
