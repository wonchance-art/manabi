<div class="poem">
<p>나는 혼자 뫼 위에 올랐어라.<br>
솟아 퍼지는 아침 햇볕에<br>
풀잎도 번쩍이며<br>
바람은 속삭여라.<br>
그러나<br>
아아 내 몸의 상처(傷處)받은 맘이어<br>
맘은 오히려 저푸고 아픔에 고요히 떨려라<br>
