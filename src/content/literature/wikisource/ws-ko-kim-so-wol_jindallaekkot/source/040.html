<div class="poem">
<p>왜 아니 오시나요.<br>
영창(映窓)에는 달빛, 매화(梅花)꽃이<br>
그림자는 산란(散亂)히 휘젓는데.<br>
아이. 눈 꽉 감고 요대로 잠을 들자.<br>
<br>
저 멀리 들리는 것!<br>
봄철의 밀물소리<br>
물나라의 영롱(玲瓏)한 구중궁궐(九重宮闕), 궁궐(宮闕)의 오요한 곳,<br>
잠 못 드는 용녀(龍女)의 춤과 노래, 봄철의 밀물소리.<br>
<br>
어둡은 가슴속의 구석구석……<br>
환연한 거울속에, 봄구름 잠긴 곳에,<br>
소솔비 나리며, 달무리 둘러라.<br>
이대도록 왜 아니 오시나요. 왜 아니 오시나요.
</p>
