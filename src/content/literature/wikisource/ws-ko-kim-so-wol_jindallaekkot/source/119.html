<div class="poem">
<p>뿌옇한 하늘, 날도 채 밝지 않았는데,<br>
흰눈이 우멍구멍 쌓인 새벽,<br>
저 남편(便) 물가 위에<br>
이상한 구름은 층층대(層層臺) 떠올라라.<br>
<br>
마을 아기는<br>
무리지어 서제(書齊)로 올라들 가고,<br>
시집살이하는 젊은이들은<br>
가끔가끔 우물길 나들어라.<br>
<br>
소삭(蕭索)한 난간(欄干) 위를 거닐으며<br>
내가 볼 때 온 아침, 내 가슴의,<br>
좁혀 옮긴 그림장(張)이 한 너풀,<br>
한갓 더운 눈물로 어룽지게.<br>
<br>
어깨 위에 총(銃) 메인 사냥받이<br>
반백(半白)의 머리털에 바람 불며<br>
한번 달음박질. 올 길 다왔어라.<br>
흰눈이 만산편야(滿山遍野)에 쌓인 아침.
</p>
