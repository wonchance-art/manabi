<div class="poem">
<p>&nbsp;<br>
들가에 떨어져 나가앉은 멧기슭의 <br>
넓은 바다의 물가 뒤에, <br>
나는 지으리, 나의 집을, <br>
다시금 큰길을 앞에다 두고. <br>
길로 지나가는 그 사람들은 <br>
제각금 떨어져서 혼자 가는 길. <br>
하이얀 여울턱에 날은 저물 때. <br>

번쩍이며 오는 아침부터, <br>
지나가는 길손을 눈여겨보며, <br>
그대인가고, 그대인가고.
</p>
