<div class="poem">
<p>오오 아내여, 나의 사랑!<br>
하늘이 묶어준 짝이라고<br>
믿고 살음이 마땅치 아니한가.<br>
아직 다시 그러랴, 안 그러랴?<br>
이상하고 별납은 사람의 맘,<br>
저 몰라라, 참인지, 거짓인지?<br>
정분(情分)으로 얽은 딴 두 몸이라면.<br>
서로 어그점인들 또 있으랴.<br>
한평생(限平生)이라도 반백년(半百年)<br>
못 사는 이 인생(人生)에!<br>
연분(緣分)의 긴 실이 그 무엇이랴?<br>
나는 말하려노라, 아무려나,<br>
죽어서도 한 곳에 묻히더라.<br>
</p>
