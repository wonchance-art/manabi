<div class="poem">
<p>산(山)새도 오리나무<br>
위에서 운다<br>
산(山)새는 왜 우노, 시메산(山)골<br>
영(嶺) 넘어 갈라고 그래서 울지.<br>
<br>
눈은 나리네, 와서 덮이네.<br>
오늘도 하룻길<br>
칠팔십리(七八十里)<br>
돌아서서 육십리(六十里)는 가기도 했소.<br>
<br>
불귀(不歸), 불귀(不歸), 다시 불귀(不歸),<br>
삼수갑산(三水甲山)에 다시 불귀(不歸).<br>
사나이 속이라 잊으련만,<br>
십오년(十五年) 정분을 못 잊겠네<br>
<br>
산에는 오는 눈, 들에는 녹는 눈.<br>
산(山)새도 오리나무<br>
위에서 운다.<br>
삼수갑산(三水甲山) 가는 길은 고개의 길.
</p>
