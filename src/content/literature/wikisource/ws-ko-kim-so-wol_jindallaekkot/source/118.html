<div class="poem">
<p>날은 저물고 눈이 나려라<br>
낯설은 물가으로 내가 왔을 때.<br>
산(山)속의 올빼미 울고울며<br>
떨어진 잎들은 눈 아래로 깔려라<br>
<br>
아아 숙살(肅殺)스럽은 풍경(風景)이어<br>
지혜(智慧)의 눈물을 내가 얻을 때!<br>
이제금 알기는 알았건마는!<br>
이 세상 모든 것을<br>
한갓 아름답은 눈얼님의<br>
그림자뿐인 줄을.<br>
<br>
이우러 향기(香氣)깊은 가을밤에<br>
우무주러진 나무그림자<br>
바람과 비가 우는 낙엽(落葉)위에.
</p>
