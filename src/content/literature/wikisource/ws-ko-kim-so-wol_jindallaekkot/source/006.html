<div class="poem">
<p>그립은 우리님의 맑은 노래는<br>
언제나 제 가슴에 젖어있어요<br>
<br>
긴 날을 문밖에서 서서 들어도<br>
그립은 우리님의 고운 노래는<br>
해지고 저물도록 귀에 들려요<br>
밤들고 잠들도록 귀에 들려요<br>
<br>
고히도 흔들리는 노래가락에<br>
내 잠은 그만이나 깊이 들어요<br>
고적한 잠자리에 홀로 누워도 <br>
내 잠은 포스근히 깊이 들어요<br>
<br>
그러나 자다 깨면 님의 노래는<br>
하나도 남김없이 잃어버려요<br>
들으면 듣는대로 님의 노래는<br>
하나도 남김없이 잊고말아요
</p>
