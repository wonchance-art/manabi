<div class="poem">
<p>저기 저 구름을 잡아타면 <br>
붉게도 피로 물든 저 구름을, <br>
밤이면 새캄한 저 구름을. <br>
잡아타고 내 몸은 저 멀리로 <br>
구만리(九萬里) 긴 하늘을 날아 건너 <br>
그대 잠든 품속에 안기렸더니, <br>
애스러라, 그리는 못한대서, <br>
그대여, 들으라 비가 되어 <br>
저 구름이 그대한테로 나리거든, <br>
생각하라, 밤저녁, 내 눈물을.
</p>
