<div class="poem">
<p>물로 사흘 배 사흘  <br>
먼 삼천리  <br>
더더구나 걸어넘는 먼 삼천리  <br>
삭주구성(朔州龜城)은 산(山)을 넘은 육천리요  <br>
<br>
물맞아 함빡이 젖은 제비도  <br>
가다가 비에 걸려 오노랍니다<br>
저녁에는 높은 산  <br>
밤에 높은 산  <br>
<br>
삭주구성은 산 넘어  <br>
먼 육천리  <br>
가끔가끔 꿈에는 사오천리  <br>
가다오다 돌아오는 길이겠지요  <br>
<br>
서로 떠난 몸이길래 몸이 그리워  <br>
님을 둔 곳이길래 곳이 그리워  <br>
못 보았소 새들도 집이 그리워  <br>
남북으로 오며가며 아니합디까  <br>
<br>
들 끝에 날아가는 나는 구름은  <br>
밤쯤은 어디 바로 가있을텐고  <br>
삭주구성은 산 넘어  <br>
먼 육천리
</p>
