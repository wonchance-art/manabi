<div class="poem">
<p>날 저물고 돋는 달에<br>
흰물은 솰솰……<br>
금모래 반짝…….<br>
청(靑)노새 몰고 가는 낭군(郎君)!<br>
여기는 강촌(江村)<br>
강촌(江村)에 내 몸은 홀로 사네.<br>
말하자면, 나도 나도<br>
늦은 봄 오늘이 다 진(盡)토록<br>
백년처권(百年妻眷)을 울고 가네.<br>
길새 저문 나는 선비,<br>
당신은 강촌(江村)에 홀로된 몸.
</p>
