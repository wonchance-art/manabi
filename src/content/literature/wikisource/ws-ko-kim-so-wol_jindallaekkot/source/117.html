<div class="poem">
<p>아주 나는 바랄 것 더 없노라<br>
빛이랴 허공이랴,<br>
소리만 남은 내 노래를<br>
바람에나 띄워서 보낼밖에.<br>
하다못해 죽어 달려가 올라<br>
좀 더 높은 데서나 보았으면!<br>
<br>
한세상 다 살아도<br>
살은 뒤 없을 것을,<br>
내가 다 아노라 지금까지<br>
살아서 이만큼 자랐으니.<br>
예전에 지나 본 모든 일을<br>
살았다고 이를 수 있을진댄!<br>
<br>
물가의 닳아져 널린 굴꺼풀에<br>
붉은 가시덤불 뻗어늙고<br>
어득어득 저문 날을<br>
비바람에 울지는 돌무더기<br>
하다못해 죽어 달려가 올라<br>
밤의 고요한 때라도 지켰으면!
</p>
