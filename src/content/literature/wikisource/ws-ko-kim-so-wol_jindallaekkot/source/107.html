<div class="poem">
<p>평양(平壤)에 대동강(大同江)은<br>
우리나라에<br>
곱기로 으뜸가는 가람이지요<br>
<br>
삼천리(三千里) 가다가다 한가운데는<br>
웃둑한 삼각산(三角山)이 <br>
솟기도 했소<br>
<br>
그래 옳소 내 누님, 오오 누이님<br>
우리나라 섬기던 한 옛적에는<br>
춘향(春香)과 이도령(李道令)도 살았다지요<br>
<br>
이편(便)에는 함양(咸陽), 저편(便)에 담양(潭陽),<br>
꿈에는 가끔가끔 산(山)을 넘어<br>
오작교(烏鵲橋) 찾아찾아 가기도 했소<br>
<br>
그래 옳소 누이님 오오 내 누님<br>
해돋고 달돋아 남원(南原)땅에는<br>
성춘향(成春香) 아가씨가 살았다지요
</p>
