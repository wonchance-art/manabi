<div class="poem">
<p>하루라도 몇 번(番)씩 내 생각은<br>
내가 무엇하려고 살려는지?<br>
모르고 살았노라, 그럴 말로<br>
그러나 흐르는 저 냇물이<br>
흘러가서 바다로 든댈진댄.<br>
일로조차 그러면, 이 내 몸은<br>
애쓴다고는 말부터 잊으리라.<br>
사노라면 사람은 죽는 것을<br>
그러나, 다시 내 몸,<br>
봄빛의 불붙는 사태흙에<br>
집 짓는 저 개아미<br>
나도 살려 하노라, 그와 같이<br>
사는 날 그날까지<br>
살음에 즐거워서,<br>
사는 것이 사람의 본뜻이면<br>
오오 그러면 내 몸에는<br>
다시는 애쓸 일도 더 없어라<br>
사노라면 사람은 죽는 것을.
</p>
