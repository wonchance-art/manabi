<div class="poem">
<p>닭은 꼬꾸요, 꼬꾸요 울 제,<br>
헛잡으니 두 팔은 밀려났네.<br>
애도 타리만치 기나긴 밤은……<br>
꿈 깨친 뒤엔 감도록 잠 아니 오네.<br>
<br>
위에는 청초(靑草)언덕, 곳은 깊섬,<br>
엊저녁 대인 남포(南浦)뱃간.<br>
몸을 잡고 뒤재며 누웠으면<br>
솜솜하게도 감도록 그리워오네.<br>
<br>
아무리 보아도<br>
밝은 등(燈)불, 어스렷한데.<br>
감으면 눈 속엔 흰 모래밭,<br>
모래에 어린 안개는 물 위에 슬 제<br>
<br>
대동강(大同江) 뱃나루에 해 돋아오네.
</p>
