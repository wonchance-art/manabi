<div class="poem">
<p>이 바로<br>
외따로 와 지나는 사람 없으니<br>
'밤 자고 가자' 하며 나는 앉어라.<br>
<br>
저 멀리, 하느편(便)에<br>
배는 떠나나가는<br>
노래 들리며<br>
<br>
눈물은<br>
흘러나려라<br>
스르르 나려감는 눈에.<br>
<br>
꿈에도 생시에도 눈에 선한 우리 집<br>
<br>
또 저 산(山) 넘어넘어<br>
구름은 가라.
</p>
