<div class="poem">
<p><br>
<span class="mw-poem-indented" style="display: inline-block; margin-inline-start: 2em;"><b>1</b></span><br>
<br>
육월(六月)<sup id="cite_ref-1" class="reference"><a href="#cite_note-1"><span class="cite-bracket">[</span>1<span class="cite-bracket">]</span></a></sup> 어스름 때의 빗줄기는<br>
암황색(暗黃色)의 시골(屍骨)을 묶어세운 듯,<br>
뜨며 흐르며 잠기는 손의 널쪽은<br>
지향(支向)도 없어라, 단청(丹靑)의 홍문(紅門)!<br>
<br>
<span class="mw-poem-indented" style="display: inline-block; margin-inline-start: 2em;"><b>2</b></span><br>
<br>
저 오늘도 그립은 바다,<br>
건너다 보자니 눈물 겨워라!<br>
조그마한 보드랍은 그 옛적 심정(心淸)의<br>
분결같은 그대의 손의<br>
사시나무 보다도 더한 아픔이<br>
내 몸을 에워싸고 휘떨며 찔러라,<br>
나서 자란 고향(故鄕)의 해돋는 바다요.
</p>
