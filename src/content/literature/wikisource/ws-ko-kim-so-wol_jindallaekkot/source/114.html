<div class="poem">
<p>그대가 돌이켜 물을 줄도 내가 아노라, <br>
'무엇이 무신(無信)함이 있더냐?' 하고, <br>
그러나 무엇하랴 오늘날은 <br>
야속히도 당장에 우리 눈으로 <br>
볼 수 없는 그것을, 물과 같이 <br>
흘러가서 없어진 맘이라고 하면. <br>
<br>
검은 구름은 멧기슭에서 어정거리며, <br>
애처롭게도 우는 산(山)의 사슴이 <br>
내 품에 속속들이 붙안기는 듯. <br>
그러나 밀물도 쌓이고 밤은 어둡어<br>
닻 주었던 자리는 알 길이 없어라. <br>
시정(市井)의 흥정 일은 <br>
외상(外上)으로 주고 받기도 하건마는.
</p>
