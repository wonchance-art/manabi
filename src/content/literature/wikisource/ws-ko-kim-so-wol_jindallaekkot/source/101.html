<div class="poem">
<p>바드득 이를 갈고<br>
죽어 볼까요<br>
창(窓)가에 아롱아롱<br>
달이 비춘다<br>
<br>
눈물은 새우잠의<br>
팔굽베개요<br>
봄꿩은 잠이 없어<br>
밤에 와 운다.<br>
<br>
두동달이베개는<br>
어디 갔는고<br>
언제는 둘이 자던 베갯머리에<br>
'죽자 사자' 언약도 하여 보았지.<br>
<br>
봄메의 멧기슭에<br>
우는 접동도<br>
내 사랑 내 사랑<br>
조히 울것다.<br>
<br>
두동달이베개는<br>
어디 갔는고<br>
창(窓)가에 아롱아롱<br>
달이 비춘다.
</p>
