<div class="poem">
<p>불빛에 떠오르는 새뽀얀 얼굴,<br>
그 얼굴이 보내는 호젓한 냄새,<br>
오고가는 입술의 주고받는 잔(盞),<br>
가느스름한 손길은 아른대여라.<br>
<br>
검으스러하면서도 붉으스러한<br>
어렴풋하면서도 다시 분명(分明)한<br>
줄그늘 위에 그대의 목노리,<br>
달빛이 수풀 위를 떠 흐르는가.<br>
<br>
그대하고 나하고 또는 그 계집<br>
밤에 노는 세 사람, 밤의 세 사람,<br>
다시금 술잔 위의 긴 봄밤은<br>
소리도 없이 창(窓)밖으로 새여 빠져라.
</p>
