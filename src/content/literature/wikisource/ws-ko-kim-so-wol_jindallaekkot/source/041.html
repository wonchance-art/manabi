<div class="poem">
<p>봄 새벽의 몹쓸 꿈<br>
깨고 나면!<br>
울짖는 까막까치, 놀라는 소리,<br>
너희들은 눈에 무엇이 보이느냐.<br>
<br>
봄철의 좋은 새벽, 풀이슬 맺혔어라.<br>
볼지어다, 세월(歲月)은 도무지 편안(便安)한데,<br>
두새없는 저 까마귀, 새들게 울짖는 저 까치야,<br>
나의 흉(凶)한 꿈 보이느냐?<br>
<br>
고요히 또 봄바람은 봄의 빈 들을 지나가며,<br>
이윽고 동산에서는 꽃잎들이 흩어질 때,<br>
말 들어라, 애틋한 이 여자(女子)야, 사랑의 때문에는<br>
모두다 사납은 조짐(兆朕)인 듯, 가슴을 뒤노아라.
</p>
