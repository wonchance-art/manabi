<div class="poem">
<p>밖에는 눈, 눈이 와라,<br>
고요히 창(窓)아래로는 달빛이 들어라.<br>
어스름타고서 오신 그 여자(女子)는<br>
내 꿈의 품속으로 들어와 안겨라.<br>
<br>
나의 베개는 눈물로 함빡히 젖었어라.<br>
그만 그 여자(女子)는 가고 말았느냐.<br>
다만 고요한 새벽, 별그림자 하나가<br>
창(窓)틈을 엿보아라.
</p>
