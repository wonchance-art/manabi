<div class="poem">
<p>어둡게 깊게 목메인 하늘.<br>
꿈의 품속으로서 구러나오는<br>
애달피 잠 안오는 유령(幽靈)의 눈결.<br>
그림자검은 개버드나무에<br>
쏟아쳐 나리는 비의 줄기는<br>
흐느껴 빗기는 주문(呪文)의 소리.<br>
<br>
시커먼 머리채 풀어헤치고<br>
아우성하면서 가시는 따님.<br>
헐벗은 벌레들은 꿈틀일 때,<br>
흑혈(黑血)의 바다. 고목(枯木)동굴(洞窟).<br>
탁목조(啄木鳥)의<br>
쪼아리는 소리, 쪼아리는 소리.
</p>
